*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#1e293b;font:14px/1.5 system-ui,Arial}.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}.side{background:#142b4a;color:white;padding:24px 14px}.logo{font-weight:800;font-size:17px;padding:8px;margin-bottom:25px}.logo small{display:block;font-size:10px;color:#b9c9dd;letter-spacing:1px}.nav button{display:block;width:100%;text-align:left;background:transparent;border:0;color:#dbe6f3;padding:12px;border-radius:8px;margin:4px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#2b4668;color:white}.main{min-width:0}.top{background:white;border-bottom:1px solid #e2e8f0;padding:18px 28px;display:flex;justify-content:space-between}.content{padding:28px;max-width:1450px;margin:auto}.head{display:flex;justify-content:space-between;align-items:start;gap:12px;margin-bottom:22px}.head h1{margin:0;font-size:26px;letter-spacing:-.6px}.muted{color:#64748b}.btn{border:1px solid #dbe2ec;background:white;padding:9px 13px;border-radius:8px;cursor:pointer;font-weight:650;color:#243348}.primary{background:#2457a7;color:white;border-color:#2457a7}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}.stat,.panel,.tablebox{background:white;border:1px solid #e2e8f0;border-radius:12px}.stat{padding:17px}.stat label{color:#64748b;font-size:12px}.stat strong{display:block;font-size:25px;margin:7px 0}.panel{padding:18px;margin-bottom:18px}.panel h2{margin:0 0 4px;font-size:16px}.tablebox{overflow:auto;margin-top:12px}table{width:100%;border-collapse:collapse;min-width:650px}th{text-align:left;color:#64748b;background:#f8fafc;font-size:10px;letter-spacing:.7px;text-transform:uppercase}th,td{padding:12px 14px;border-bottom:1px solid #edf1f6}tr:last-child td{border-bottom:0}.badge{background:#e6f7f0;color:#08745e;border-radius:20px;padding:4px 8px;font-size:11px;font-weight:700}.warn{background:#fff3d7;color:#936300}.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:grid;gap:5px}.field label{font-weight:650;font-size:12px;color:#475569}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #d5deea;border-radius:8px;background:white;font:inherit}.span2{grid-column:span 2}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.notice{padding:12px;background:#fff8e6;border:1px solid #f0dfa9;color:#805b0a;border-radius:9px;margin-bottom:18px;font-size:12px}.modalback{display:none;position:fixed;inset:0;background:#10182799;align-items:center;justify-content:center;padding:16px;z-index:5}.modalback.open{display:flex}.modal{background:white;border-radius:14px;padding:22px;width:min(850px,100%);max-height:92vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modalhead h2{margin:0}.empty{text-align:center;padding:35px;color:#64748b}.summary{margin:15px 0 0 auto;max-width:350px;background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:14px}.sum{display:flex;justify-content:space-between;padding:5px 0}.total{border-top:1px solid #d5deea;margin-top:6px;padding-top:10px;font-size:17px;font-weight:800}.lineform{display:grid;grid-template-columns:2fr 1fr auto;gap:8px;align-items:end;margin:16px 0}.notice-info{background:#edf4ff;border:1px solid #d5e4ff;padding:10px;border-radius:8px;color:#254e8b;font-size:12px;margin:10px 0}@media(max-width:850px){.app{grid-template-columns:1fr}.side{padding:10px}.logo{margin:0}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;width:auto}.stats{grid-template-columns:repeat(2,1fr)}.content{padding:17px}.top{padding:14px}.head{flex-direction:column}.form{grid-template-columns:1fr}.span2{grid-column:auto}.lineform{grid-template-columns:1fr 1fr}.lineform button{grid-column:span 2}}@media print{.side,.top,.no-print{display:none!important}.app{display:block}.content{padding:0}.modalback{position:static;display:block;background:white}.modal{max-height:none;width:100%;box-shadow:none}.modalhead button,.actions{display:none!important}}
</style></head><body><div class="app"><aside class="side"><div class="logo">CRESCENT<small>CONTRACTORS PVT. LTD.</small></div><div class="nav"><button class="active" data-p="dashboard">▦ &nbsp; Dashboard</button><button data-p="subs">♙ &nbsp; Subcontractors</button><button data-p="rates">₹ &nbsp; Rate Master</button><button data-p="measure">⌁ &nbsp; Measurements</button><button data-p="muster">♧ &nbsp; Muster Labour</button><button data-p="bills">▤ &nbsp; RA Bills</button></div><p style="font-size:10px;color:#aabbd1;margin-top:45px">BILLING WORKSPACE · PROTOTYPE</p></aside><main class="main"><div class="top"><span>Operations / <b id="crumb">Dashboard</b></span><b>Crescent Team</b></div><div class="content" id="view"></div></main></div><div class="modalback" id="back"><div class="modal"><div class="modalhead"><h2 id="mt">Add record</h2><button class="btn" onclick="closeM()">✕</button></div><div id="mb"></div></div></div>
<script>
const KEY='cc_subbilling_v2',project='IT Commercial Building for Geojit at Kochi - Shell & Core Works Package';
const seed={subs:[{id:'s1',name:'Tapas Biswas',trade:'Steel Work',phone:'',project,bank:'',account:'',ifsc:''}],rates:[{id:'r1',sub:'s1',desc:'Reinforcement / Steel Work',unit:'Kg',rate:8,effective:'2026-08-01'}],measure:[],muster:[],bills:[]};
let d;try{d=JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch{d=structuredClone(seed)}
// Upgrade earlier worker-wise muster rows to category-wise headcount rows when present.
if(d.muster?.some(x=>x.worker)){const groups={};d.muster.forEach(x=>{let k=[x.date,x.sub,x.cat,x.wage,x.otrate].join('|');if(!groups[k])groups[k]={id:'agg-'+k,date:x.date,sub:x.sub,cat:x.cat,count:0,half:0,wage:Number(x.wage)||0,ot:0,otrate:Number(x.otrate)||0};let g=groups[k];if(x.att==='Half day'||Number(x.days)===.5)g.half++;else if(x.att!=='Absent'&&Number(x.days)>0)g.count++;g.ot+=Number(x.ot)||0});d.muster=Object.values(groups);d.muster.forEach(x=>{x.otrate=x.otrate||0})}
let page='dashboard',lines=[];
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),n=x=>Number(x)||0,money=x=>'₹'+n(x).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}),today=()=>new Date().toISOString().slice(0,10),save=()=>localStorage.setItem(KEY,JSON.stringify(d)),sn=id=>d.subs.find(s=>s.id===id)?.name||'—',cost=m=>n(m.wage)*(n(m.count)+n(m.half)*.5)+n(m.ot)*n(m.otrate),title=p=>({dashboard:'Dashboard',subs:'Subcontractors',rates:'Rate Master',measure:'Measurements',muster:'Muster Labour',bills:'RA Bills'})[p];
function go(p){page=p;document.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('active',b.dataset.p===p));$('crumb').textContent=title(p);render()}document.querySelector('.nav').onclick=e=>{let b=e.target.closest('[data-p]');if(b)go(b.dataset.p)};
function head(t,s,button=''){return '<div class="head"><div><h1>'+t+'</h1><div class="muted">'+s+'</div></div><div class="no-print">'+button+'</div></div>'}function btn(t,fn,primary=false){return '<button class="btn '+(primary?'primary':'')+'" onclick="'+fn+'">'+t+'</button>'}function empty(t,s){return '<div class="empty"><b>'+t+'</b><br>'+s+'</div>'}function table(headers,rows){return '<div class="tablebox"><table><thead><tr>'+headers.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows+'</tbody></table></div>'}
function render(){let v=$('view');if(page==='dashboard'){let labour=d.muster.reduce((a,x)=>a+cost(x),0);v.innerHTML=head('Billing overview','Subcontractor work, measured quantities and labour recovery.',btn('＋ New RA Bill','newBill()',true))+'<div class="notice"><b>Prototype:</b> Data is saved in this browser only. Shared database and user authentication are required before live multi-user billing.</div><div class="stats"><div class="stat"><label>Subcontractors</label><strong>'+d.subs.length+'</strong><span class="muted">Registered</span></div><div class="stat"><label>Rate items</label><strong>'+d.rates.length+'</strong><span class="muted">Agreed rates</span></div><div class="stat"><label>RA bills</label><strong>'+d.bills.length+'</strong><span class="muted">Created to date</span></div><div class="stat"><label>Muster labour logged</label><strong>'+money(labour)+'</strong><span class="muted">Available for deduction</span></div></div><div class="panel"><h2>Recent RA Bills</h2><p class="muted">Latest billing activity</p>'+table(['Bill','Subcontractor','Gross work','Muster deduction','Net payable','Status'],d.bills.slice().reverse().slice(0,5).map(b=>'<tr><td><b>'+esc(b.no)+'</b><div class="muted">'+esc(b.date)+'</div></td><td>'+esc(sn(b.sub))+'</td><td>'+money(b.gross)+'</td><td>− '+money(b.labour)+'</td><td><b>'+money(b.net)+'</b></td><td><span class="badge '+(b.status==='Approved'?'':'warn')+'">'+b.status+'</span></td></tr>').join('')||'<tr><td colspan="6">'+empty('No bills created','Create your first RA bill.')+'</td></tr>')+'</div>'}
if(page==='subs')v.innerHTML=head('Subcontractors','Maintain profiles, work category and project allocation.',btn('＋ Add subcontractor','subForm()',true))+table(['Subcontractor','Trade','Project','Bank / IFSC','Action'],d.subs.map(s=>'<tr><td><b>'+esc(s.name)+'</b><div class="muted">'+esc(s.phone)+'</div></td><td>'+esc(s.trade)+'</td><td>'+esc(s.project)+'</td><td>'+esc(s.bank||'—')+'<div class="muted">'+esc(s.ifsc||'')+'</div></td><td>'+btn('Edit','subForm(\''+s.id+'\')')+'</td></tr>').join('')||'<tr><td colspan="5">'+empty('No subcontractors','Add a subcontractor to begin.')+'</td></tr>');
if(page==='rates')v.innerHTML=head('Rate master','Agreed rate items are copied into bills to preserve historical values.',btn('＋ Add rate','rateForm()',true))+table(['Subcontractor','Work item','Unit','Rate','Effective date','Action'],d.rates.map(r=>'<tr><td>'+esc(sn(r.sub))+'</td><td><b>'+esc(r.desc)+'</b></td><td>'+esc(r.unit)+'</td><td>'+money(r.rate)+'</td><td>'+esc(r.effective)+'</td><td>'+btn('Edit','rateForm(\''+r.id+'\')')+'</td></tr>').join('')||'<tr><td colspan="6">'+empty('No rates','Add agreed rates for work items.')+'</td></tr>');
if(page==='measure')v.innerHTML=head('Measurements','Record current quantities against agreed rate items.',btn('＋ Add measurement','measureForm()',true))+table(['Date','Subcontractor','Work item','Location / remarks','Quantity','Rate','Amount'],d.measure.slice().reverse().map(x=>'<tr><td>'+esc(x.date)+'</td><td>'+esc(sn(x.sub))+'</td><td><b>'+esc(x.desc)+'</b><div class="muted">'+esc(x.unit)+'</div></td><td>'+esc(x.note||'—')+'</td><td>'+n(x.qty).toLocaleString('en-IN')+'</td><td>'+money(x.rate)+'</td><td>'+money(x.qty*x.rate)+'</td></tr>').join('')||'<tr><td colspan="7">'+empty('No measurements','Record a measured quantity.')+'</td></tr>');
if(page==='muster')v.innerHTML=head('Muster labour','Enter only the number of labourers in each category for each date. No individual labour names are collected. Bill-period muster cost is deducted from the matching subcontractor bill.',btn('＋ Add daily muster','musterForm()',true))+'<div class="stats"><div class="stat"><label>Daily category entries</label><strong>'+d.muster.length+'</strong></div><div class="stat"><label>Total muster cost</label><strong>'+money(d.muster.reduce((a,x)=>a+cost(x),0))+'</strong></div></div>'+table(['Date','Subcontractor','Labour category','Full-day labourers','Half-day labourers','Wage / day','OT hours','Total cost'],d.muster.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(x=>'<tr><td>'+esc(x.date)+'</td><td>'+esc(sn(x.sub))+'</td><td><b>'+esc(x.cat)+'</b></td><td>'+n(x.count)+'</td><td>'+n(x.half)+'</td><td>'+money(x.wage)+'</td><td>'+n(x.ot)+'</td><td><b>'+money(cost(x))+'</b></td></tr>').join('')||'<tr><td colspan="8">'+empty('No muster entries','Add a daily headcount by labour category.')+'</td></tr>');
if(page==='bills')v.innerHTML=head('RA Bills','Create, review and print running account bills.',btn('＋ New RA Bill','newBill()',true))+'<div class="no-print" style="margin-bottom:12px">'+btn('Export register','exportBills()')+'</div>'+table(['Bill','Subcontractor / project','Period','Gross work','Muster deduction','Net payable','Status','Actions'],d.bills.slice().reverse().map(b=>'<tr><td><b>'+esc(b.no)+'</b><div class="muted">'+esc(b.date)+'</div></td><td>'+esc(sn(b.sub))+'<div class="muted">'+esc(b.project)+'</div></td><td>'+esc(b.from)+' – '+esc(b.to)+'</td><td>'+money(b.gross)+'</td><td>− '+money(b.labour)+'</td><td><b>'+money(b.net)+'</b></td><td><span class="badge '+(b.status==='Approved'?'':'warn')+'">'+b.status+'</span></td><td>'+btn('View / Print','viewBill(\''+b.id+'\')')+' '+(b.status==='Approved'?'':btn('Approve','approve(\''+b.id+'\')'))+'</td></tr>').join('')||'<tr><td colspan="8">'+empty('No RA bills','Create a bill after entering work quantities and muster.')+'</td></tr>')}
function modal(t,h){$('mt').textContent=t;$('mb').innerHTML=h;$('back').classList.add('open')}function closeM(){$('back').classList.remove('open')}function opts(items,selected,lab){return items.map(x=>'<option value="'+x.id+'" '+(x.id===selected?'selected':'')+'>'+esc(lab(x))+'</option>').join('')}
function subForm(id){let s=d.subs.find(x=>x.id===id)||{name:'',trade:'Steel Work',phone:'',project,bank:'',account:'',ifsc:''};modal(id?'Edit subcontractor':'Add subcontractor','<form onsubmit="saveSub(event,\''+(id||'')+'\')"><div class="form"><div class="field"><label>Name / firm *</label><input name="name" required value="'+esc(s.name)+'"></div><div class="field"><label>Work category *</label><input name="trade" required value="'+esc(s.trade)+'"></div><div class="field"><label>Contact</label><input name="phone" value="'+esc(s.phone)+'"></div><div class="field"><label>Project *</label><input name="project" required value="'+esc(s.project)+'"></div><div class="field"><label>Bank name</label><input name="bank" value="'+esc(s.bank)+'"></div><div class="field"><label>Account number</label><input name="account" value="'+esc(s.account)+'"></div><div class="field"><label>IFSC</label><input name="ifsc" value="'+esc(s.ifsc)+'"></div></div><div class="actions"><button type="button" class="btn" onclick="closeM()">Cancel</button><button class="btn primary">Save subcontractor</button></div></form>')}
function saveSub(e,id){e.preventDefault();let x=Object.fromEntries(new FormData(e.target));x.id=id||'s'+Date.now();if(id)d.subs=d.subs.map(y=>y.id===id?x:y);else d.subs.push(x);save();closeM();render()}
function rateForm(id){if(!d.subs.length)return alert('Add a subcontractor first.');let r=d.rates.find(x=>x.id===id)||{sub:d.subs[0].id,desc:'',unit:'Kg',rate:8,effective:today()};modal(id?'Edit rate':'Add agreed rate','<form onsubmit="saveRate(event,\''+(id||'')+'\')"><div class="form"><div class="field span2"><label>Subcontractor *</label><select name="sub">'+opts(d.subs,r.sub,x=>x.name)+'</select></div><div class="field span2"><label>Work description *</label><input name="desc" required value="'+esc(r.desc)+'"></div><div class="field"><label>Unit</label><select name="unit">'+['Kg','MT','m³','m²','RM','Nos','Day','Hrs','LS'].map(u=>'<option '+(u===r.unit?'selected':'')+'>'+u+'</option>').join('')+'</select></div><div class="field"><label>Rate (₹) *</label><input name="rate" type="number" min="0" step=".01" required value="'+r.rate+'"></div><div class="field"><label>Effective from</label><input name="effective" type="date" value="'+esc(r.effective)+'"></div></div><div class="actions"><button type="button" class="btn" onclick="closeM()">Cancel</button><button class="btn primary">Save rate</button></div></form>')}
function saveRate(e,id){e.preventDefault();let x=Object.fromEntries(new FormData(e.target));x.rate=n(x.rate);x.id=id||'r'+Date.now();if(id)d.rates=d.rates.map(y=>y.id===id?x:y);else d.rates.push(x);save();closeM();render()}
function measureForm(){if(!d.rates.length)return alert('Add a rate first.');modal('Add measurement','<form onsubmit="saveMeasure(event)"><div class="form"><div class="field"><label>Subcontractor</label><select name="sub" id="msub" onchange="fillRates(\'mrate\',this.value)">'+opts(d.subs,d.rates[0].sub,x=>x.name)+'</select></div><div class="field"><label>Date</label><input type="date" name="date" value="'+today()+'" required></div><div class="field span2"><label>Rate item</label><select name="rate" id="mrate">'+opts(d.rates,d.rates[0].id,x=>x.desc+' · '+x.unit+' · '+money(x.rate))+'</select></div><div class="field"><label>Measured quantity</label><input name="qty" type="number" min="0" step=".001" required></div><div class="field"><label>Location / remarks</label><input name="note"></div></div><div class="actions"><button type="button" class="btn" onclick="closeM()">Cancel</button><button class="btn primary">Save measurement</button></div></form>')}
function fillRates(id,sub){let el=$(id);el.innerHTML=opts(d.rates.filter(r=>r.sub===sub),null,x=>x.desc+' · '+x.unit+' · '+money(x.rate))}
function saveMeasure(e){e.preventDefault();let f=Object.fromEntries(new FormData(e.target)),r=d.rates.find(x=>x.id===f.rate);if(!r)return alert('No rate item available for this subcontractor.');d.measure.push({id:'m'+Date.now(),sub:r.sub,date:f.date,desc:r.desc,unit:r.unit,rate:r.rate,qty:n(f.qty),note:f.note});save();closeM();render()}
function musterForm(){if(!d.subs.length)return alert('Add a subcontractor first.');modal('Daily category-wise muster','<div class="notice-info">Enter headcount by category for one date. No worker names are required. Cost = (full-day count + half-day count × 0.5) × daily wage + overtime cost.</div><form onsubmit="saveMuster(event)"><div class="form"><div class="field"><label>Date *</label><input name="date" type="date" value="'+today()+'" required></div><div class="field"><label>Subcontractor *</label><select name="sub">'+opts(d.subs,null,x=>x.name)+'</select></div><div class="field"><label>Labour category *</label><select name="cat" required><option>Barbender</option><option>Helper</option><option>Foreman</option><option>Skilled Labour</option><option>Unskilled Labour</option><option>Other</option></select></div><div class="field"><label>Full-day labourers *</label><input name="count" type="number" min="0" step="1" value="0" required></div><div class="field"><label>Half-day labourers</label><input name="half" type="number" min="0" step="1" value="0" required></div><div class="field"><label>Wage per labourer / day (₹) *</label><input name="wage" type="number" min="0" step=".01" value="700" required></div><div class="field"><label>Total overtime hours (optional)</label><input name="ot" type="number" min="0" step=".25" value="0"></div><div class="field"><label>Overtime rate / hour (₹)</label><input name="otrate" type="number" min="0" step=".01" value="0"></div></div><div class="actions"><button type="button" class="btn" onclick="closeM()">Cancel</button><button class="btn primary">Save muster entry</button></div></form>')}
function saveMuster(e){e.preventDefault();let x=Object.fromEntries(new FormData(e.target));x.count=n(x.count);x.half=n(x.half);x.wage=n(x.wage);x.ot=n(x.ot);x.otrate=n(x.otrate);if(x.count+x.half<=0)return alert('Enter at least one full-day or half-day labourer.');let existing=d.muster.find(m=>m.date===x.date&&m.sub===x.sub&&m.cat===x.cat&&n(m.wage)===x.wage&&n(m.otrate)===x.otrate);if(existing){if(!confirm('A muster entry for this date, subcontractor, category and wage rate already exists. Add these counts to the existing entry?'))return;existing.count+=x.count;existing.half+=x.half;existing.ot+=x.ot}else{x.id='lab'+Date.now();d.muster.push(x)}save();closeM();render()}
function newBill(){if(!d.subs.length||!d.rates.length)return alert('Add a subcontractor and rate item first.');lines=[];modal('Create subcontractor RA bill','<form onsubmit="saveBill(event)"><div class="form"><div class="field"><label>Project</label><input name="project" required value="'+esc(d.subs[0].project)+'"></div><div class="field"><label>Subcontractor</label><select name="sub" id="bsub" onchange="fillRates(\'brate\',this.value)">'+opts(d.subs,d.subs[0].id,x=>x.name)+'</select></div><div class="field"><label>RA bill number</label><input name="no" value="RA-'+String(d.bills.length+1).padStart(2,'0')+'" required></div><div class="field"><label>Bill date</label><input name="date" type="date" value="'+today()+'" required></div><div class="field"><label>Period from</label><input name="from" type="date" value="'+today()+'" required></div><div class="field"><label>Period to</label><input name="to" type="date" value="'+today()+'" required></div></div><hr style="border:0;border-top:1px solid #e2e8f0;margin:18px 0"><h3>Measured work items</h3><div class="lineform"><div class="field"><label>Rate item</label><select id="brate">'+opts(d.rates.filter(r=>r.sub===d.subs[0].id),null,x=>x.desc+' · '+x.unit+' · '+money(x.rate))+'</select></div><div class="field"><label>Current quantity</label><input id="bqty" type="number" min="0" step=".001" value="0"></div><button type="button" class="btn" onclick="addLine()">＋ Add item</button></div><div id="lines"></div><div class="form" style="margin-top:12px"><div class="field"><label>Other deductions (₹)</label><input name="other" type="number" min="0" step=".01" value="0"></div><div class="field"><label>Retention (%)</label><input name="ret" type="number" min="0" max="100" step=".1" value="5"></div><div class="field span2"><label>Notes</label><textarea name="notes" rows="2"></textarea></div></div><div class="actions"><button type="button" class="btn" onclick="closeM()">Cancel</button><button class="btn primary">Save draft bill</button></div></form>')}
function addLine(){let r=d.rates.find(x=>x.id===$('brate').value),qty=n($('bqty').value);if(!r||qty<=0)return alert('Choose a rate and enter a quantity greater than zero.');lines.push({rateid:r.id,desc:r.desc,unit:r.unit,rate:r.rate,qty});drawLines()}
function drawLines(){let el=$('lines');if(!el)return;el.innerHTML=lines.length?table(['Work item','Unit','Current qty','Rate','Amount',''],lines.map((x,i)=>'<tr><td>'+esc(x.desc)+'</td><td>'+esc(x.unit)+'</td><td>'+x.qty+'</td><td>'+money(x.rate)+'</td><td>'+money(x.qty*x.rate)+'</td><td><button type="button" class="btn" onclick="lines.splice('+i+',1);drawLines()">Remove</button></td></tr>').join(''))+'<div class="summary"><div class="sum">Measured work subtotal <b>'+money(lines.reduce((s,x)=>s+x.qty*x.rate,0))+'</b></div></div>':'<div class="empty">No work items added yet.</div>'}
function saveBill(e){e.preventDefault();if(!lines.length)return alert('Add at least one measured work item.');let f=Object.fromEntries(new FormData(e.target));if(f.to<f.from)return alert('Bill period end date cannot be before the start date.');if(d.bills.some(b=>b.sub===f.sub&&b.no===f.no))return alert('Bill number already exists for this subcontractor.');let gross=lines.reduce((s,x)=>s+x.qty*x.rate,0),muster=d.muster.filter(x=>x.sub===f.sub&&x.date>=f.from&&x.date<=f.to),labour=muster.reduce((s,x)=>s+cost(x),0),ret=gross*n(f.ret)/100,other=n(f.other),net=Math.max(0,gross-labour-ret-other);d.bills.push({...f,id:'b'+Date.now(),lines:lines.map(x=>({...x})),gross,labour,ret,other,net,musterIds:muster.map(x=>x.id),status:'Draft',created:Date.now()});save();closeM();go('bills')}
function approve(id){let b=d.bills.find(x=>x.id===id);if(confirm('Approve '+b.no+'?')){b.status='Approved';save();render()}}
function viewBill(id){let b=d.bills.find(x=>x.id===id),prev=d.bills.filter(x=>x.sub===b.sub&&x.created<b.created);modal('RA Bill · '+b.no,'<div id="printable"><div style="text-align:center"><h2 style="margin:0">CRESCENT CONTRACTORS PVT. LTD.</h2><b>SUBCONTRACTOR RUNNING ACCOUNT BILL</b><p>'+esc(b.project)+'</p></div><div class="form"><div><b>Subcontractor:</b> '+esc(sn(b.sub))+'</div><div><b>Bill No:</b> '+esc(b.no)+'</div><div><b>Period:</b> '+esc(b.from)+' to '+esc(b.to)+'</div><div><b>Date:</b> '+esc(b.date)+'</div></div>'+table(['Sl','Description','Unit','Previous qty','Present qty','Cumulative qty','Rate','Amount'],b.lines.map((l,i)=>{let pq=prev.reduce((s,p)=>s+p.lines.filter(x=>x.rateid===l.rateid).reduce((a,x)=>a+x.qty,0),0);return '<tr><td>'+(i+1)+'</td><td>'+esc(l.desc)+'</td><td>'+l.unit+'</td><td>'+pq+'</td><td>'+l.qty+'</td><td>'+(pq+l.qty)+'</td><td>'+money(l.rate)+'</td><td>'+money(l.qty*l.rate)+'</td></tr>'}).join(''))+'<div class="summary"><div class="sum">Gross measured work <b>'+money(b.gross)+'</b></div><div class="sum">Muster labour deduction <b>− '+money(b.labour)+'</b></div><div class="sum">Other deductions <b>− '+money(b.other)+'</b></div><div class="sum">Retention <b>− '+money(b.ret)+'</b></div><div class="sum total">Net payable <span>'+money(b.net)+'</span></div></div><h3>Muster recovery details (category-wise)</h3>'+table(['Date','Labour category','Full-day count','Half-day count','Wage/day','OT hours','Total cost'],d.muster.filter(x=>b.musterIds.includes(x.id)).map(x=>'<tr><td>'+esc(x.date)+'</td><td>'+esc(x.cat)+'</td><td>'+n(x.count)+'</td><td>'+n(x.half)+'</td><td>'+money(x.wage)+'</td><td>'+n(x.ot)+'</td><td>'+money(cost(x))+'</td></tr>').join('')||'<tr><td colspan="7">No muster labour in this period.</td></tr>')+'<div style="display:flex;justify-content:space-between;margin-top:50px"><span>Quantity Surveyor<br><br>Signature: _____________</span><span>Site Engineer / Project Manager<br><br>Signature: _____________</span></div></div><div class="actions no-print"><button class="btn" onclick="closeM()">Close</button><button class="btn primary" onclick="printBill()">Print / Save PDF</button></div>')}
function printBill(){let c=$('printable').innerHTML,w=window.open('','_blank');if(!w)return alert('Allow pop-ups to print the bill.');w.document.write('<html><head><title>RA Bill</title><style>body{font:12px Arial;padding:24px}table{width:100%;border-collapse:collapse;margin:12px 0}th,td{border:1px solid #bbb;padding:6px;text-align:left}th{background:#eee}.summary{margin:12px 0 12px auto;width:320px;border:1px solid #bbb;padding:10px}.sum{display:flex;justify-content:space-between;padding:5px}.total{font-weight:bold;border-top:1px solid #aaa}</style></head><body>'+c+'</body></html>');w.document.close();w.print()}
function exportBills(){let rows=[['Bill','Subcontractor','Project','Date','From','To','Gross','Muster deduction','Other deduction','Retention','Net','Status'],...d.bills.map(b=>[b.no,sn(b.sub),b.project,b.date,b.from,b.to,b.gross,b.labour,b.other,b.ret,b.net,b.status])];let csv=rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='ra-bill-register.csv';a.click();URL.revokeObjectURL(a.href)}
save();render();
</script></body></html>
