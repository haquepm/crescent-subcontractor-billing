
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crescent | Secure Login Test</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid;
      place-items: center; padding: 20px;
      font: 15px/1.5 system-ui, Arial, sans-serif;
      background: #f1f5f9; color: #1e293b;
    }
    .card {
      width: 100%; max-width: 420px; background: white;
      padding: 28px; border-radius: 16px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 10px 30px #0f172a12;
    }
    h1 { margin: 0 0 5px; font-size: 24px; }
    .muted { color: #64748b; margin: 0 0 22px; }
    label { display: block; font-weight: 650; margin: 14px 0 5px; }
    input {
      width: 100%; padding: 12px; border: 1px solid #cbd5e1;
      border-radius: 8px; font: inherit;
    }
    button {
      width: 100%; padding: 12px; margin-top: 18px;
      border: 0; border-radius: 8px; background: #2457a7;
      color: white; font: inherit; font-weight: 700; cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #message { margin-top: 16px; overflow-wrap: anywhere; }
    .success { color: #08745e; }
    .error { color: #b42318; }
    .session { background: #ecfdf5; padding: 12px; border-radius: 8px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>CRESCENT</h1>
    <p class="muted">CONTRACTORS PVT. LTD. · Login connection test</p>

    <form id="loginForm">
      <label for="email">Work email</label>
      <input id="email" type="email" autocomplete="username" required>

      <label for="password">Password</label>
      <input id="password" type="password"
             autocomplete="current-password" required>

      <button id="loginButton" type="submit">Sign in</button>
    </form>

    <div id="message" role="status" aria-live="polite"></div>
    <button id="logoutButton" type="button" hidden>Sign out</button>
  </main>

  <script>
    const SUPABASE_URL = 'https://iqltunrvlosxdxucibef.supabase.co';

    // Replace this placeholder with your Supabase publishable/anon key.
    // Never put the Supabase secret/service_role key in this file.
    const SUPABASE_PUBLIC_KEY = 'sb_publishable_F6gwvkXDVWv7baPVOcOMmQ_iuB1iNwT';

    const message = document.getElementById('message');
    const form = document.getElementById('loginForm');
    const loginButton = document.getElementById('loginButton');
    const logoutButton = document.getElementById('logoutButton');

    function showMessage(text, type = '') {
      message.className = type;
      message.textContent = text;
    }

    if (
      SUPABASE_PUBLIC_KEY.includes('PASTE_YOUR_') ||
      !window.supabase
    ) {
      form.hidden = true;
      showMessage(
        'Setup required: add your Supabase publishable/anon key and ensure the Supabase library loads.',
        'error'
      );
    } else {
      const client = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLIC_KEY
      );

      async function refreshSession() {
        const { data, error } = await client.auth.getSession();

        if (error) {
          showMessage('Could not check login: ' + error.message, 'error');
          return;
        }

        if (data.session) {
          form.hidden = true;
          logoutButton.hidden = false;
          showMessage(
            'Login successful. Signed in as ' + data.session.user.email,
            'success'
          );
        } else {
          form.hidden = false;
          logoutButton.hidden = true;
          showMessage('Enter your work email and password to test login.');
        }
      }

      form.addEventListener('submit', async event => {
        event.preventDefault();
        loginButton.disabled = true;
        showMessage('Signing in…');

        try {
          const { error } = await client.auth.signInWithPassword({
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value
          });

          if (error) {
            showMessage('Sign-in failed: ' + error.message, 'error');
          } else {
            await refreshSession();
          }
        } catch (error) {
          showMessage('Connection error. Check your internet connection and configuration.', 'error');
        } finally {
          loginButton.disabled = false;
        }
      });

      logoutButton.addEventListener('click', async () => {
        const { error } = await client.auth.signOut();

        if (error) {
          showMessage('Sign-out failed: ' + error.message, 'error');
        } else {
          await refreshSession();
        }
      });

      refreshSession();
    }
  </script>
</body>
</html>
