<style>

#d5e4ff}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.stat{margin:0}.stat strong{display:block;font-size:24px}.tablebox{overflow:auto;border:1px solid #dbe3ee;border-radius:10px;background:white}table{border-collapse:collapse;width:100%;min-width:650px}th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #e8edf4;vertical-align:top}th{font-size:11px;text-transform:uppercase;color:#64748b;background:#f8fafc}tr:last-child td{border-bottom:0}.empty{text-align:center;padding:26px;color:#64748b}.pill{border-radius:99px;padding:3px 8px;background:#fef3c7;color:#92400e;font-size:11px;font-weight:700}.pill.approved{background:#dcfce7;color:#166534}.pill.rejected{background:#fee2e2;color:#991b1b}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 14px}.span2{grid-column:1/-1}.end{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.modalback{display:none;position:fixed;inset:0;background:#0f172a80;z-index:5;padding:18px;align-items:center;justify-content:center}.modalback.open{display:flex}.modal{background:#fff;border-radius:14px;padding:22px;width:min(850px,100%);max-height:92vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{margin:0}.summary{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.summary div{padding:10px;border:1px solid #dbe3ee;border-radius:8px;background:#f8fafc}.billpaper{background:#fff;color:#111;padding:15px}.billpaper h2,.billpaper h3{text-align:center;margin:3px}.billpaper table{min-width:0}.billpaper th,.billpaper td{border:1px solid #aaa;padding:6px}.right{text-align:right}
@media(max-width:850px){#app{grid-template-columns:1fr}.side{padding:10px}.logo{padding:0 8px 10px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.content{padding:14px}.top{padding:12px}.stats{grid-template-columns:repeat(2,1fr)}.head{flex-direction:column}.grid{grid-template-columns:1fr}.span2{grid-column:auto}}
@media print{.side,.top,.no-print,.modalhead{display:none!important}#app{display:block}.content{padding:0}.modalback{display:block;position:static;background:white;padding:0}.modal{width:100%;max-height:none;box-shadow:none;padding:0}}
</style></head><body>
<div id="loginWrap"><div class="login"><div class="brand">CRESCENT</div><div class="muted">CONTRACTORS PVT. LTD. · Subcontractor Billing</div><div id="loginMsg"></div><form id="loginForm"><label>Work email</label><input id="email" type="email" autocomplete="username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><button id="loginBtn" class="btn primary" style="width:100%;margin-top:18px">Sign in</button></form><p class="muted">Only accounts created by your Supabase administrator can sign in.</p></div></div>
<div id="app" class="hidden"><aside class="side"><div class="logo">CRESCENT<small>CONTRACTORS PVT. LTD.</small></div><div class="nav"><button data-p="dashboard" class="active">▦ Dashboard</button><button data-p="subs">♙ Subcontractors</button><button data-p="rates">₹ Rate Master</button><button data-p="measure">⌁ Measurements</button><button data-p="muster">♧ Muster Labour</button><button data-p="bills">▤ RA Bills</button></div><p class="muted" style="font-size:10px;margin:30px 10px">DATABASE-BACKED WORKSPACE</p></aside><main class="main"><div class="top"><span>Operations / <b id="crumb">Dashboard</b></span><span><span id="userLabel" class="muted"></span> <button id="logout" class="btn">Sign out</button></span></div><div id="view" class="content">Loading…</div></main></div>
<div id="back" class="modalback"><div class="modal"><div class="modalhead"><h2 id="mt">Record</h2><button id="close" class="btn">Close</button></div><div id="mb"></div></div></div>
<script>
(()=>{'use strict';
const URL='https://iqltunrvlosxdxucibef.supabase.co';
// Paste the SAME sb_publishable_... key from your working login-test.html. Never use an sb_secret/service_role key.
const PUBLIC_KEY='sb_publishable_F6gwvkXDVWv7baPVOcOMmQ_iuB1iNwT';
const PROJECT='IT Commercial Building for Geojit at Kochi - Shell & Core Works Package';
const $=id=>document.getElementById(id),n=x=>Number(x)||0,money=x=>'₹'+n(x).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}),today=()=>new Date().toISOString().slice(0,10),dt=x=>x?new Date(x+'T00:00:00').toLocaleDateString('en-IN'):'—',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const titles={dashboard:'Dashboard',subs:'Subcontractors',rates:'Rate Master',measure:'Measurements',muster:'Muster Labour',bills:'RA Bills'};
let sb,user,page='dashboard',D={subs:[],rates:[],measure:[],muster:[],bills:[],items:[],ma:[],la:[]};
function msg(t,cls='',where='loginMsg'){ $(where).innerHTML=t?`<div class="alert ${cls}">${esc(t)}</div>`:''}
function openModal(t,html){$('mt').textContent=t;$('mb').innerHTML=html;$('back').classList.add('open')}
function closeModal(){$('back').classList.remove('open');$('mb').innerHTML=''}
async function q(p){let {data,error}=await p;if(error)throw error;return data}
const subName=id=>D.subs.find(s=>s.id===id)?.name||'—',rate=id=>D.rates.find(r=>r.id===id);
const opts=(arr,val,lab)=>arr.map(x=>`<option value="${esc(x[val])}">${esc(lab(x))}</option>`).join('');
const btn=(label,fn,primary=false)=>`<button class="btn ${primary?'primary':''}" onclick="${fn}">${label}</button>`;
const head=(t,s,a='')=>`<div class="head"><div><h1>${t}</h1><div class="muted">${s}</div></div><div class="actions no-print">${a}</div></div>`;
function tbl(h,rows){return `<div class="tablebox"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td class="empty" colspan="${h.length}">No records found.</td></tr>`}</tbody></table></div>`}
async function load(){const [subs,rates,measure,muster,bills,items,ma,la]=await Promise.all([
q(sb.from('subcontractors').select('*').order('name')),q(sb.from('rate_items').select('*').order('effective_date',{ascending:false})),
q(sb.from('measurements').select('*').order('measurement_date',{ascending:false})),q(sb.from('muster_entries').select('*').order('muster_date',{ascending:false})),
q(sb.from('ra_bills').select('*').order('created_at',{ascending:false})),q(sb.from('ra_bill_items').select('*')),
q(sb.from('ra_bill_measurements').select('*')),q(sb.from('ra_bill_muster_entries').select('*'))]);D={subs,rates,measure,muster,bills,items,ma,la};render()}
async function refresh(){try{await load()}catch(e){$('view').innerHTML=`<div class="alert err">Could not load database records: ${esc(e.message)}. Check table names, grants and RLS policies.</div>`}}
function go(p){page=p;document.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('active',b.dataset.p===p));$('crumb').textContent=titles[p];render()}
function status(s){let v=(s||'draft').toLowerCase();return `<span class="pill ${esc(v)}">${esc(s||'draft')}</span>`}
function render(){let v=$('view');
if(page==='dashboard'){let labour=D.muster.reduce((a,m)=>a+n(m.wage_per_day)*(n(m.full_day_count)+n(m.half_day_count)*.5)+n(m.overtime_hours)*n(m.overtime_rate),0);v.innerHTML=head('Billing overview','Subcontractor work, measurements and labour recovery.',btn('＋ New RA Bill','newBill()',true))+`<div class="notice"><b>Supabase connected.</b> Team records are shared for authenticated users. Verify quantities and deductions before approving any bill.</div><div class="stats"><div class="stat"><span class="muted">Subcontractors</span><strong>${D.subs.length}</strong></div><div class="stat"><span class="muted">Rate items</span><strong>${D.rates.length}</strong></div><div class="stat"><span class="muted">RA bills</span><strong>${D.bills.length}</strong></div><div class="stat"><span class="muted">Muster total</span><strong>${money(labour)}</strong></div></div><div class="panel"><h2>Recent bills</h2>${tbl(['Bill','Subcontractor','Date','Status',''],D.bills.slice(0,8).map(b=>`<tr><td>${esc(b.bill_number)}</td><td>${esc(subName(b.subcontractor_id))}</td><td>${dt(b.bill_date)}</td><td>${status(b.status)}</td><td>${btn('View',`viewBill('${b.id}')`)}</td></tr>`).join(''))}</div>`}
if(page==='subs')v.innerHTML=head('Subcontractors','Manage subcontractor profiles.',btn('＋ Add subcontractor','subForm()',true))+tbl(['Name','Work description','Contact','Active',''],D.subs.map(s=>`<tr><td><b>${esc(s.name)}</b></td><td>${esc(s.work_description||'—')}</td><td>${esc(s.contact_number||'—')}</td><td>${s.active?'Yes':'No'}</td><td>${btn('Edit',`subForm('${s.id}')`)}</td></tr>`).join(''));
if(page==='rates')v.innerHTML=head('Rate master','Rates used in a bill are copied into bill snapshots.',btn('＋ Add rate','rateForm()',true))+tbl(['Subcontractor','Work item','Unit','Rate','Effective',''],D.rates.map(r=>`<tr><td>${esc(subName(r.subcontractor_id))}</td><td>${esc(r.work_item)}</td><td>${esc(r.unit)}</td><td>${money(r.rate)}</td><td>${dt(r.effective_date)}</td><td>${btn('Edit',`rateForm('${r.id}')`)}</td></tr>`).join(''));
if(page==='measure')v.innerHTML=head('Measurements','Saved quantities available for allocation to one bill.',btn('＋ Add measurement','measureForm()',true))+tbl(['Date','Subcontractor','Work item','Location','Description','Qty','Unit','Status'],D.measure.map(m=>{let r=rate(m.rate_item_id),a=D.ma.find(a=>a.measurement_id===m.id);return `<tr><td>${dt(m.measurement_date)}</td><td>${esc(subName(m.subcontractor_id))}</td><td>${esc(r?.work_item||'—')}</td><td>${esc(m.location||'—')}</td><td>${esc(m.description||'—')}</td><td>${n(m.quantity)}</td><td>${esc(r?.unit||'—')}</td><td>${a?'Allocated':'Available'}</td></tr>`}).join(''));
if(page==='muster')v.innerHTML=head('Muster labour','Category-wise headcount only; no individual worker names.',btn('＋ Add muster','musterForm()',true))+tbl(['Date','Subcontractor','Category','Full','Half','Wage/day','OT hours','OT rate','Cost','Status'],D.muster.map(m=>{let a=D.la.find(a=>a.muster_entry_id===m.id),cost=n(m.wage_per_day)*(n(m.full_day_count)+n(m.half_day_count)*.5)+n(m.overtime_hours)*n(m.overtime_rate);return `<tr><td>${dt(m.muster_date)}</td><td>${esc(subName(m.subcontractor_id))}</td><td>${esc(m.labour_category)}</td><td>${n(m.full_day_count)}</td><td>${n(m.half_day_count)}</td><td>${money(m.wage_per_day)}</td><td>${n(m.overtime_hours)}</td><td>${money(m.overtime_rate)}</td><td>${money(cost)}</td><td>${a?'Allocated':'Available'}</td></tr>`}).join(''));
if(page==='bills')v.innerHTML=head('RA Bills','Draft, review, approve and print bills.',btn('＋ New RA Bill','newBill()',true)+btn('Export register CSV','exportRegister()'))+tbl(['Bill','Subcontractor','Date','Period','Gross','Muster','Retention','Other','Net','Status','Actions'],D.bills.map(b=>{let its=D.items.filter(i=>i.ra_bill_id===b.id),gross=its.reduce((a,i)=>a+n(i.current_quantity)*n(i.rate_snapshot),0),lab=D.la.filter(a=>a.ra_bill_id===b.id).reduce((a,x)=>a+n(x.allocated_amount),0),ret=gross*n(b.retention_percent)/100,net=Math.max(0,gross-lab-ret-n(b.other_deductions));return `<tr><td>${esc(b.bill_number)}</td><td>${esc(subName(b.subcontractor_id))}</td><td>${dt(b.bill_date)}</td><td>${dt(b.period_from)} – ${dt(b.period_to)}</td><td>${money(gross)}</td><td>${money(lab)}</td><td>${money(ret)}</td><td>${money(b.other_deductions)}</td><td><b>${money(net)}</b></td><td>${status(b.status)}</td><td>${btn('View',`viewBill('${b.id}')`)} ${b.status==='draft'?btn('Approve',`approveBill('${b.id}')`,true):''} ${b.status==='draft'?btn('Reject / release',`rejectBill('${b.id}')`):''}</td></tr>`}).join(''))}
function subForm(id=''){let s=D.subs.find(x=>x.id===id)||{name:'',work_description:'',contact_number:'',active:true};openModal(id?'Edit subcontractor':'Add subcontractor',`<form id="f" class="grid"><div><label>Name *</label><input name="name" required value="${esc(s.name)}"></div><div><label>Contact number</label><input name="contact_number" value="${esc(s.contact_number||'')}"></div><div class="span2"><label>Work description / trade</label><input name="work_description" value="${esc(s.work_description||'')}"></div><div><label>Active</label><select name="active"><option value="true" ${s.active?'selected':''}>Active</option><option value="false" ${!s.active?'selected':''}>Inactive</option></select></div><div class="span2 end"><button type="button" class="btn" onclick="closeM()">Cancel</button><button class="btn primary">Save</button></div></form>`);$('f').onsubmit=async e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));f.active=f.active==='true';try{if(id)await q(sb.from('subcontractors').update(f).eq('id',id));else await q(sb.from('subcontractors').insert(f));closeM();await refresh()}catch(err){msg(err.message,'err','mb')}}}
function rateForm(id=''){let r=D.rates.find(x=>x.id===id)||{subcontractor_id:D.subs[0]?.id,work_item:'',unit:'Kg',rate:'',effective_date:today()};openModal(id?'Edit rate':'Add rate',`<form id="f" class="grid"><div><label>Subcontractor *</label><select name="subcontractor_id">${opts(D.subs.filter(s=>s.active),'id',s=>s.name)}</select></div><div><label>Work item *</label><input name="work_item" required value="${esc(r.work_item)}"></div><div><label>Unit *</label><input name="unit" required value="${esc(r.unit)}"></div><div><label>Rate ₹ *</label><input name="rate" type="number" min="0" step=".0001" required value="${esc(r.rate)}"></div><div><label>Effective date *</label><input name="effective_date" type="date" required value="${esc(r.effective_date)}"></div><div class="span2 notice">Rates referenced by existing bills should not be changed; add a new effective-dated rate instead.</div><div class="span2 end"><button type="button" class="btn" onclick="closeM()">Cancel</button><button class="btn primary">Save rate</button></div></form>`);$('f').elements.subcontractor_id.value=r.subcontractor_id;$('f').onsubmit=async e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));f.rate=Number(f.rate);try{if(id){if(D.items.some(i=>i.rate_item_id===id))throw Error('This rate is used in bill items. Add a new rate row instead.');await q(sb.from('rate_items').update(f).eq('id',id))}else await q(sb.from('rate_items').insert(f));closeM();await refresh()}catch(err){msg(err.message,'err','mb')}}}
function measureForm(){if(!D.subs.length||!D.rates.length)return alert('Add a subcontractor and rate first.');let subs=D.subs.filter(s=>s.active);openModal('Add measurement',`<form id="f" class="grid"><div><label>Subcontractor</label><select id="msub">${opts(subs,'id',s=>s.name)}</select></div><div><label>Rate item</label><select name="rate_item_id" id="mrate"></select></div><div><label>Measurement date</label><input name="measurement_date" type="date" required value="${today()}"></div><div><label>Quantity</label><input name="quantity" type="number" min=".0001" step=".0001" required></div><div><label>Location / floor / grid</label><input name="location"></div><div><label>Description / reference</label><input name="description"></div><div class="span2 end"><button type="button" class="btn" onclick="closeM()">Cancel</button><button class="btn primary">Save measurement</button></div></form>`);function fill(){ $('mrate').innerHTML=opts(D.rates.filter(r=>r.subcontractor_id===$('msub').value),'id',r=>`${r.work_item} · ${r.unit} · ${money(r.rate)}`)}$('msub').onchange=fill;fill();$('f').onsubmit=async e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));f.subcontractor_id=$('msub').value;f.quantity=Number(f.quantity);try{await q(sb.from('measurements').insert(f));closeM();await refresh()}catch(err){msg(err.message,'err','mb')}}}
function musterForm(){if(!D.subs.length)return alert('Add a subcontractor first.');openModal('Add muster entry',`<form id="f" class="grid"><div><label>Subcontractor</label><select name="subcontractor_id">${opts(D.subs.filter(s=>s.active),'id',s=>s.name)}</select></div><div><label>Date</label><input name="muster_date" type="date" required value="${today()}"></div><div><label>Labour category</label><input name="labour_category" required placeholder="Helper / Fitter / Steel fixer"></div><div><label>Full-day count</label><input name="full_day_count" type="number" min="0" step="1" value="0" required></div><div><label>Half-day count</label><input name="half_day_count" type="number" min="0" step="1" value="0" required></div><div><label>Wage per day ₹</label><input name="wage_per_day" type="number" min="0" step=".01" value="0" required></div><div><label>Overtime hours</label><input name="overtime_hours" type="number" min="0" step=".25" value="0" required></div><div><label>Overtime rate ₹/hour</label><input name="overtime_rate" type="number" min="0" step=".01" value="0" required></div><div class="span2 notice">Cost = (full days + half days × 0.5) × wage/day + overtime hours × OT rate.</div><div class="span2 end"><button type="button" class="btn" onclick="closeM()">Cancel</button><button class="btn primary">Save muster</button></div></form>`);$('f').onsubmit=async e=>{e.preventDefault();let f=Object.fromEntries(new FormData(e.target));['full_day_count','half_day_count','wage_per_day','overtime_hours','overtime_rate'].forEach(k=>f[k]=Number(f[k]));try{await q(sb.from('muster_entries').insert(f));closeM();await refresh()}catch(err){msg(err.message,'err','mb')}}}
function newBill(){if(!D.subs.length)return alert('Add a subcontractor first.');openModal('Create RA Bill',`<form id="bf"><div class="grid"><div><label>Subcontractor</label><select id="bsub">${opts(D.subs.filter(s=>s.active),'id',s=>s.name)}</select></div><div><label>Bill number</label><input name="bill_number" required placeholder="RA-001"></div><div><label>Bill date</label><input name="bill_date" type="date" required value="${today()}"></div><div><label>Period from</label><input name="period_from" type="date" required value="${today()}"></div><div><label>Period to</label><input name="period_to" type="date" required value="${today()}"></div><div><label>Retention %</label><input name="retention_percent" type="number" min="0" max="100" step=".01" value="5" required></div><div><label>Other deductions ₹</label><input name="other_deductions" type="number" min="0" step=".01" value="0" required></div><div class="span2"><label>Notes</label><textarea name="notes"></textarea></div></div><div class="panel"><h3>Available measurements</h3><p class="muted">Select measurements within the period. Each measurement is allocated to only one bill.</p><button type="button" id="lm" class="btn">Load measurements</button> <button type="button" id="sm" class="btn">Select all</button><div id="measureList"></div></div><div class="panel"><h3>Available muster entries</h3><button type="button" id="ll" class="btn">Load muster</button> <button type="button" id="sl" class="btn">Select all</button><div id="musterList"></div></div><div id="preview" class="summary"></div><div class="end"><button type="button" class="btn" onclick="closeM()">Cancel</button><button class="btn primary">Save draft</button></div></form>`);
let ms=[],ls=[];const form=$('bf');
function avm(){return D.measure.filter(m=>m.subcontractor_id===$('bsub').value&&m.measurement_date>=form.elements.period_from.value&&m.measurement_date<=form.elements.period_to.value&&!D.ma.some(a=>a.measurement_id===m.id))}
function avl(){return D.muster.filter(m=>m.subcontractor_id===$('bsub').value&&m.muster_date>=form.elements.period_from.value&&m.muster_date<=form.elements.period_to.value&&!D.la.some(a=>a.muster_entry_id===m.id))}
function selected(cls,arr){return [...document.querySelectorAll('.'+cls+':checked')].map(el=>arr.find(x=>x.id===el.value)).filter(Boolean)}
function sums(){let a=selected('pm',ms).reduce((s,m)=>s+n(m.quantity)*n(rate(m.rate_item_id)?.rate),0),l=selected('pl',ls).reduce((s,m)=>s+n(m.wage_per_day)*(n(m.full_day_count)+n(m.half_day_count)*.5)+n(m.overtime_hours)*n(m.overtime_rate),0),r=a*n(form.elements.retention_percent.value)/100,o=n(form.elements.other_deductions.value);$('preview').innerHTML=`<div>Gross work<br><b>${money(a)}</b></div><div>Muster deduction<br><b>${money(l)}</b></div><div>Retention<br><b>${money(r)}</b></div><div>Net payable<br><b>${money(Math.max(0,a-l-r-o))}</b></div>`}
function drawM(){ms=avm();$('measureList').innerHTML=ms.length?ms.map(m=>{let r=rate(m.rate_item_id);return `<label><input class="pm" type="checkbox" value="${m.id}" style="width:auto"> ${dt(m.measurement_date)} · ${esc(r?.work_item)} · ${esc(m.location||m.description||'')} · ${n(m.quantity)} ${esc(r?.unit)} × ${money(r?.rate)}</label>`}).join(''):'<p class="muted">No available measurements in this period.</p>';sums()}
function drawL(){ls=avl();$('musterList').innerHTML=ls.length?ls.map(m=>{let c=n(m.wage_per_day)*(n(m.full_day_count)+n(m.half_day_count)*.5)+n(m.overtime_hours)*n(m.overtime_rate);return `<label><input class="pl" type="checkbox" value="${m.id}" style="width:auto"> ${dt(m.muster_date)} · ${esc(m.labour_category)} · ${money(c)}</label>`}).join(''):'<p class="muted">No available muster entries in this period.</p>';sums()}
$('lm').onclick=drawM;$('ll').onclick=drawL;$('sm').onclick=()=>{document.querySelectorAll('.pm').forEach(x=>x.checked=true);sums()};$('sl').onclick=()=>{document.querySelectorAll('.pl').forEach(x=>x.checked=true);sums()};
['bsub'].forEach(id=>$(id).onchange=()=>{drawM();drawL()});['period_from','period_to'].forEach(k=>form.elements[k].onchange=()=>{drawM();drawL()});form.elements.retention_percent.oninput=sums;form.elements.other_deductions.oninput=sums;
$('mb').addEventListener('change',e=>{if(e.target.matches('.pm,.pl'))sums()});
form.onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(form)),mSelected=selected('pm',ms),lSelected=selected('pl',ls);if(f.period_to<f.period_from)return msg('Period end cannot be before start.','err','mb');if(!mSelected.length)return msg('Select at least one measurement.','err','mb');if(D.bills.some(b=>b.subcontractor_id===$('bsub').value&&b.bill_number.toLowerCase()===f.bill_number.trim().toLowerCase()))return msg('Bill number already exists for this subcontractor.','err','mb');
let bill=null;try{bill=await q(sb.from('ra_bills').insert({subcontractor_id:$('bsub').value,bill_number:f.bill_number.trim(),bill_date:f.bill_date,period_from:f.period_from,period_to:f.period_to,status:'draft',retention_percent:Number(f.retention_percent),other_deductions:Number(f.other_deductions),notes:f.notes||null}).select().single());
const ids=[...new Set(mSelected.map(m=>m.rate_item_id))],items=ids.map(id=>{let r=rate(id),cur=mSelected.filter(m=>m.rate_item_id===id).reduce((s,m)=>s+n(m.quantity),0),prev=D.items.filter(i=>i.rate_item_id===id&&D.bills.some(b=>b.id===i.ra_bill_id&&b.subcontractor_id===$('bsub').value&&b.status==='approved')).reduce((s,i)=>s+n(i.current_quantity),0);return {ra_bill_id:bill.id,rate_item_id:id,work_item_snapshot:r.work_item,unit_snapshot:r.unit,rate_snapshot:n(r.rate),previous_quantity:prev,current_quantity:cur,cumulative_quantity:prev+cur}});
await q(sb.from('ra_bill_items').insert(items));
await q(sb.from('ra_bill_measurements').insert(mSelected.map(m=>({ra_bill_id:bill.id,measurement_id:m.id,allocated_quantity:n(m.quantity)}))));
if(lSelected.length)await q(sb.from('ra_bill_muster_entries').insert(lSelected.map(m=>({ra_bill_id:bill.id,muster_entry_id:m.id,allocated_amount:n(m.wage_per_day)*(n(m.full_day_count)+n(m.half_day_count)*.5)+n(m.overtime_hours)*n(m.overtime_rate)}))));
closeM();await refresh();go('bills');alert('Draft saved. Review the bill before approving.');}catch(err){msg('Save failed: '+err.message+'. A partial draft may exist; inspect RA Bills before retrying.','err','mb')}}
}
async function approveBill(id){let b=D.bills.find(x=>x.id===id);if(!b||b.status!=='draft')return;if(!D.items.some(x=>x.ra_bill_id===id)||!D.ma.some(x=>x.ra_bill_id===id))return alert('Cannot approve: bill needs bill items and measurement allocations.');if(!confirm(`Approve ${b.bill_number}? It will affect future cumulative quantities.`))return;try{await q(sb.from('ra_bills').update({status:'approved',approved_at:new Date().toISOString(),approved_by:user.id}).eq('id',id).eq('status','draft'));await refresh();go('bills')}catch(e){alert('Approval failed: '+e.message)}}
async function rejectBill(id){let b=D.bills.find(x=>x.id===id);if(!b||b.status!=='draft'||!confirm(`Reject ${b.bill_number} and release its allocations?`))return;try{await q(sb.from('ra_bills').update({status:'rejected'}).eq('id',id).eq('status','draft'));await q(sb.from('ra_bill_measurements').delete().eq('ra_bill_id',id));await q(sb.from('ra_bill_muster_entries').delete().eq('ra_bill_id',id));await refresh()}catch(e){alert('Release failed: '+e.message+'. Inspect the bill and allocations.')}} 
function viewBill(id){let b=D.bills.find(x=>x.id===id);if(!b)return;let its=D.items.filter(x=>x.ra_bill_id===id),la=D.la.filter(x=>x.ra_bill_id===id),gross=its.reduce((a,x)=>a+n(x.current_quantity)*n(x.rate_snapshot),0),lab=la.reduce((a,x)=>a+n(x.allocated_amount),0),ret=gross*n(b.retention_percent)/100,other=n(b.other_deductions),net=Math.max(0,gross-lab-ret-other);let rows=its.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.work_item_snapshot)}</td><td>${esc(x.unit_snapshot)}</td><td class="right">${n(x.previous_quantity)}</td><td class="right">${n(x.current_quantity)}</td><td class="right">${n(x.cumulative_quantity)}</td><td class="right">${money(x.rate_snapshot)}</td><td class="right">${money(n(x.current_quantity)*n(x.rate_snapshot))}</td></tr>`).join('');let mrows=la.map(x=>{let m=D.muster.find(y=>y.id===x.muster_entry_id);return `<tr><td>${dt(m?.muster_date)}</td><td>${esc(m?.labour_category||'Muster')}</td><td class="right">${money(x.allocated_amount)}</td></tr>`}).join('');openModal('RA Bill · '+b.bill_number,`<div class="actions no-print">${btn('Print / Save PDF','window.print()',true)} ${b.status==='draft'?btn('Approve',`approveBill('${id}')`,true):''} ${b.status==='draft'?btn('Reject / release',`rejectBill('${id}')`):''} ${btn('Export CSV',`exportBillCSV('${id}')`)}</div><div class="billpaper"><h2>CRESCENT CONTRACTORS PVT. LTD.</h2><h3>SUBCONTRACTOR RUNNING ACCOUNT BILL</h3><p style="text-align:center">${esc(PROJECT)}</p><p><b>Subcontractor:</b> ${esc(subName(b.subcontractor_id))} &nbsp; <b>Bill:</b> ${esc(b.bill_number)}<br><b>Date:</b> ${dt(b.bill_date)} &nbsp; <b>Period:</b> ${dt(b.period_from)} – ${dt(b.period_to)}<br><b>Status:</b> ${esc(b.status)}</p>${tbl(['Sl','Work item','Unit','Previous qty','Present qty','Cumulative qty','Rate','Amount'],rows)}<h3 style="text-align:left;margin-top:16px">Deductions and payable</h3>${tbl(['Particulars','Amount'],`<tr><td>Gross measured work</td><td class="right">${money(gross)}</td></tr><tr><td>Muster recovery</td><td class="right">${money(lab)}</td></tr><tr><td>Retention (${n(b.retention_percent)}%)</td><td class="right">${money(ret)}</td></tr><tr><td>Other deductions</td><td class="right">${money(other)}</td></tr><tr><td><b>Net payable</b></td><td class="right"><b>${money(net)}</b></td></tr>`)}<h3 style="text-align:left;margin-top:16px">Muster entries</h3>${tbl(['Date','Category','Amount'],mrows)}<p><b>Notes:</b> ${esc(b.notes||'—')}</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:35px;margin-top:50px"><div>Prepared by: _____________</div><div>Approved by: _____________</div></div></div>`)}
function csv(name,rows){let text=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),blob=new Blob(['\ufeff'+text],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();URL.revokeObjectURL(url)}
function exportBillCSV(id){let b=D.bills.find(x=>x.id===id);if(!b)return;csv(`RA-${b.bill_number}.csv`,[['Bill','Subcontractor','Date','Period from','Period to','Status'],[b.bill_number,subName(b.subcontractor_id),b.bill_date,b.period_from,b.period_to,b.status],[],['Work item','Unit','Previous qty','Present qty','Cumulative qty','Rate','Amount'],...D.items.filter(x=>x.ra_bill_id===id).map(x=>[x.work_item_snapshot,x.unit_snapshot,x.previous_quantity,x.current_quantity,x.cumulative_quantity,x.rate_snapshot,n(x.current_quantity)*n(x.rate_snapshot)])])}
function exportRegister(){csv('Crescent-RA-Bill-Register.csv',[['Bill','Subcontractor','Date','Period from','Period to','Gross','Muster','Retention','Other','Net','Status'],...D.bills.map(b=>{let it=D.items.filter(x=>x.ra_bill_id===b.id),g=it.reduce((a,x)=>a+n(x.current_quantity)*n(x.rate_snapshot),0),l=D.la.filter(x=>x.ra_bill_id===b.id).reduce((a,x)=>a+n(x.allocated_amount),0),r=g*n(b.retention_percent)/100;return [b.bill_number,subName(b.subcontractor_id),b.bill_date,b.period_from,b.period_to,g,l,r,b.other_deductions,Math.max(0,g-l-r-n(b.other_deductions)),b.status]})])}
document.querySelector('.nav').onclick=e=>{let b=e.target.closest('[data-p]');if(b)go(b.dataset.p)};$('close').onclick=closeM;$('back').onclick=e=>{if(e.target===$('back'))closeM()};
$('loginForm').onsubmit=async e=>{e.preventDefault();$('loginBtn').disabled=true;msg('Signing in…');try{let {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;user=data.user;$('loginWrap').classList.add('hidden');$('app').classList.remove('hidden');$('userLabel').textContent=user.email;await refresh()}catch(err){msg('Sign-in failed: '+err.message,'err')}finally{$('loginBtn').disabled=false}};
$('logout').onclick=async()=>{await sb.auth.signOut();user=null;$('app').classList.add('hidden');$('loginWrap').classList.remove('hidden')};
Object.assign(window,{subForm,rateForm,measureForm,musterForm,newBill,viewBill,approveBill,rejectBill,exportBillCSV,exportRegister,closeM});
async function init(){if(!window.supabase){msg('Supabase client library did not load. Check internet.','err');return}if(PUBLIC_KEY.includes('PASTE_YOUR_')){msg('Replace PUBLIC_KEY with the same publishable key used in login-test.html.','err');return}sb=window.supabase.createClient(URL,PUBLIC_KEY);sb.auth.onAuthStateChange((ev,session)=>{if(session?.user){user=session.user;$('loginWrap').classList.add('hidden');$('app').classList.remove('hidden');$('userLabel').textContent=user.email;refresh()}else{$('app').classList.add('hidden');$('loginWrap').classList.remove('hidden')}});let {data,error}=await sb.auth.getSession();if(error){msg(error.message,'err');return}if(data.session){user=data.session.user;$('loginWrap').classList.add('hidden');$('app').classList.remove('hidden');$('userLabel').textContent=user.email;await refresh()}}
init();
})();
