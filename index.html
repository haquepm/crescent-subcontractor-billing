/* Crescent brand glassmorphism refresh */
:root{--crescent-blue:#0874b9;--crescent-deep:#102c56;--crescent-orange:#f39200;--glass-border:rgba(255,255,255,.72);--glass-white:rgba(255,255,255,.66);--ink:#142b50;--muted:#526b8d}
body{background:radial-gradient(ellipse at 12% 0%,rgba(65,173,255,.26),transparent 38%),radial-gradient(ellipse at 95% 12%,rgba(255,167,64,.25),transparent 35%),linear-gradient(135deg,#eaf4ff 0%,#f5f8ff 48%,#fff4e8 100%);color:var(--ink)}
#app{grid-template-columns:246px minmax(0,1fr);background:transparent;min-height:100vh}
.side{position:relative;overflow:hidden;background:linear-gradient(165deg,rgba(9,75,143,.88),rgba(14,47,88,.94));border-right:1px solid rgba(255,255,255,.45);padding:20px 14px;box-shadow:8px 0 32px rgba(16,44,86,.08);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
.side:before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;background:rgba(36,167,255,.2);filter:blur(18px);left:-130px;bottom:12%}.side>*{position:relative;z-index:1}
.logo{padding:8px 6px 24px;text-align:center}.side-logo{width:100%;max-width:205px;height:auto;object-fit:contain;display:block;margin:0 auto 15px;background:rgba(255,255,255,.96);border-radius:12px;padding:9px 7px}.logo small{display:block;color:#cde5ff;font-size:9px;letter-spacing:2px;line-height:1.7}
.nav{gap:7px}.nav button{display:flex;align-items:center;min-height:46px;color:#e1efff;text-align:left;border:1px solid transparent;border-radius:12px;padding:12px 13px;transition:all .2s ease}.nav button.active,.nav button:hover{background:linear-gradient(110deg,rgba(28,158,255,.95),rgba(16,116,203,.72));border-color:rgba(255,255,255,.65);color:#fff;box-shadow:0 8px 22px rgba(0,119,214,.25);transform:translateY(-1px)}
.main{min-width:0}.top{position:sticky;top:0;z-index:4;background:rgba(255,255,255,.64);border-bottom:1px solid rgba(255,255,255,.85);padding:15px 26px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 6px 22px rgba(30,70,120,.04)}.top .btn{border-radius:10px}.content{padding:25px;max-width:1700px;margin:auto}
.head{align-items:center;margin-bottom:22px}.head h1{font-size:clamp(24px,2.1vw,32px);letter-spacing:-.7px;color:#10264b}.head .muted{color:#526b8d;margin-top:4px}
.btn{border:1px solid rgba(166,191,222,.75);background:rgba(255,255,255,.76);color:#17416f;border-radius:11px;padding:10px 14px;box-shadow:0 3px 12px rgba(20,55,100,.04);transition:all .18s ease}.btn:hover{transform:translateY(-1px);box-shadow:0 7px 18px rgba(20,55,100,.12)}.btn.primary{background:linear-gradient(135deg,#087ac4,#1260bb);color:white;border-color:#1483d0;box-shadow:0 7px 18px rgba(8,116,185,.2)}.btn.danger{color:#b42318}
.notice,.panel,.stat{background:rgba(255,255,255,.64);border:1px solid var(--glass-border);border-radius:17px;padding:18px;margin:15px 0;box-shadow:0 10px 32px rgba(39,83,135,.07);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}.notice{background:rgba(222,240,255,.68);color:#174a82;border-color:rgba(177,218,255,.8)}.stats{gap:14px;margin:18px 0}.stat{margin:0;min-height:128px;position:relative;overflow:hidden}.stat:nth-child(odd){background:linear-gradient(135deg,rgba(255,255,255,.8),rgba(210,235,255,.66))}.stat:nth-child(even){background:linear-gradient(135deg,rgba(255,255,255,.82),rgba(255,230,202,.65))}.stat span{color:#48658a}.stat strong{font-size:clamp(23px,2vw,30px);color:#102b55;margin-top:8px;letter-spacing:-.7px}
.tablebox{overflow:auto;border:1px solid rgba(255,255,255,.92);border-radius:14px;background:rgba(255,255,255,.64);box-shadow:0 8px 24px rgba(33,73,119,.05);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}table{min-width:680px}th,td{padding:12px 13px;border-bottom:1px solid rgba(195,213,235,.55)}th{color:#49668d;background:rgba(222,237,252,.62);font-size:10px;letter-spacing:.5px}tbody tr:hover td{background:rgba(222,240,255,.38)}.pill{display:inline-block;border-radius:999px;padding:5px 10px;background:#fff0d3;color:#9b5a00;font-size:11px;font-weight:750}.pill.approved{background:#d8f8e9;color:#08744b}.pill.rejected{background:#ffe2e2;color:#a51d2d}
.grid{gap:0 16px}input,select,textarea{border:1px solid #cad9eb;border-radius:10px;background:rgba(255,255,255,.88);color:#18385f;outline:none;transition:border-color .18s,box-shadow .18s}input:focus,select:focus,textarea:focus{border-color:#1684cf;box-shadow:0 0 0 3px rgba(22,132,207,.13)}label{color:#355477} .modalback{background:rgba(10,28,54,.46);backdrop-filter:blur(8px)}.modal{border:1px solid rgba(255,255,255,.8);border-radius:20px;background:linear-gradient(145deg,rgba(255,255,255,.98),rgba(242,248,255,.96));box-shadow:0 25px 80px rgba(7,34,72,.25);padding:25px}.modalhead{margin-bottom:16px}.modalhead h2{color:#112e57}.summary div{border:1px solid rgba(255,255,255,.9);border-radius:12px;background:rgba(230,242,255,.7);padding:13px;box-shadow:0 4px 12px rgba(30,70,120,.04)}
.login{background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.9);border-radius:22px;box-shadow:0 24px 70px rgba(20,67,117,.16);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);padding:32px}.login-logo{display:block;width:100%;max-width:300px;height:auto;margin:0 auto 12px}.brand{font-size:0;color:transparent}.login .muted{text-align:center}.login form{text-align:left}.billpaper{background:#fff;color:#111;border-radius:8px}
@media(max-width:1000px){#app{grid-template-columns:205px minmax(0,1fr)}.content{padding:18px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:850px){#app{grid-template-columns:1fr}.side{padding:10px 12px;border-right:0;border-bottom:1px solid rgba(255,255,255,.5)}.logo{display:flex;align-items:center;gap:12px;text-align:left;padding:4px 6px 10px}.side-logo{width:145px;max-width:145px;margin:0;padding:5px}.logo small{font-size:8px}.nav{display:flex;overflow:auto;padding-bottom:3px}.nav button{white-space:nowrap;min-height:42px;padding:9px 12px}.top{padding:12px 15px}.content{padding:14px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.head{flex-direction:column;align-items:flex-start}.grid{grid-template-columns:1fr}.span2{grid-column:auto}.modal{padding:17px;border-radius:16px}}
@media(max-width:460px){.stats{grid-template-columns:1fr 1fr;gap:8px}.stat{padding:13px;min-height:110px}.stat strong{font-size:22px}.top{font-size:12px}.side-logo{width:118px;max-width:118px}.logo small{letter-spacing:1px}}
@media print{body{background:white!important}.side,.top,.no-print,.modalhead{display:none!important}.content{padding:0}.modalback{display:block;position:static;background:white;padding:0;backdrop-filter:none}.modal{width:100%;max-height:none;box-shadow:none;padding:0;border:0;background:white}.billpaper{border-radius:0}}

#app{grid-template-columns:260px minmax(0,1fr);background:transparent;min-height:100vh}
.side{position:relative;background:rgba(216,235,255,.64);border-right:1px solid rgba(255,255,255,.86);padding:20px 14px;box-shadow:inset -1px 0 rgba(80,139,202,.08);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);color:#12315d}
.side:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(181,218,255,.22));pointer-events:none}.side>*{position:relative;z-index:1}
.logo{padding:4px 2px 28px;text-align:center}.side-logo{width:100%;max-width:224px;display:block;margin:0 auto 12px;height:auto;object-fit:contain;background:transparent;border-radius:0;padding:0;mix-blend-mode:multiply}.logo small{color:#294a76;font-size:9px;letter-spacing:2px}
.nav{gap:8px}.nav button{display:flex;align-items:center;min-height:48px;color:#19385f;text-align:left;border:1px solid transparent;border-radius:13px;padding:12px 14px;transition:all .2s ease;font-size:15px}.nav button.active,.nav button:hover{background:linear-gradient(110deg,rgba(18,160,255,.94),rgba(0,112,219,.82));border:1px solid rgba(255,255,255,.95);color:white;box-shadow:0 7px 18px rgba(0,119,214,.2)}
.top{position:sticky;top:0;z-index:4;background:rgba(255,255,255,.54);border-bottom:1px solid rgba(255,255,255,.86);padding:14px 24px;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 4px 20px rgba(35,80,130,.04)}.top .btn{border-radius:12px}
.content{padding:25px;max-width:1900px;margin:auto}.head{align-items:center;margin-bottom:20px}.head h1{font-size:clamp(26px,2.2vw,36px);letter-spacing:-.8px;color:#071b4d}.head .muted{color:#4d6790;margin-top:4px}
.btn{border:1px solid rgba(255,255,255,.94);background:rgba(255,255,255,.72);color:#12457e;border-radius:12px;padding:10px 14px;box-shadow:0 4px 15px rgba(22,66,120,.07);transition:all .18s}.btn:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(22,66,120,.12)}.btn.primary{background:linear-gradient(135deg,#078ce5,#0962d1);color:white;border-color:rgba(255,255,255,.9);box-shadow:0 7px 18px rgba(8,116,185,.2)}
.notice,.panel,.stat{background:rgba(255,255,255,.68);border:1px solid rgba(255,255,255,.9);border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 10px 30px rgba(34,83,139,.08);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}.notice{background:rgba(226,241,255,.68);color:#194c84;border-color:rgba(183,220,255,.85)}.stats{gap:14px;margin:18px 0}.stat{margin:0;min-height:142px;position:relative;overflow:hidden;padding:20px 22px}.stat:nth-child(odd){background:linear-gradient(130deg,rgba(255,255,255,.8),rgba(207,234,255,.76))}.stat:nth-child(even){background:linear-gradient(130deg,rgba(255,255,255,.84),rgba(255,229,203,.82))}.stat strong{font-size:clamp(24px,2vw,34px);color:#0b2859;margin-top:7px}.stat .stat-icon{width:48px;height:48px;border-radius:13px;background:linear-gradient(135deg,#2cc4ff,#0878e9);color:white;display:grid;place-items:center;font-size:23px;float:left;margin:0 14px 18px 0}.stat:nth-child(even) .stat-icon{background:linear-gradient(135deg,#ffb15b,#ff7000)}.stat .stat-label{display:block;padding-top:4px;color:#34557f;min-height:43px}.stat .stat-value{clear:both;display:block;font-size:34px;line-height:1.2}
.tablebox{overflow:auto;border:1px solid rgba(255,255,255,.96);border-radius:14px;background:rgba(255,255,255,.68);box-shadow:0 8px 24px rgba(33,73,119,.06);backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px)}table{min-width:680px}th,td{padding:12px 13px;border-bottom:1px solid rgba(195,213,235,.52)}th{color:#49668d;background:rgba(221,237,253,.72);font-size:10px;letter-spacing:.4px}tbody tr:hover td{background:rgba(222,240,255,.42)}.pill{display:inline-block;border-radius:999px;padding:5px 10px;background:#fff0d3;color:#9b5a00;font-size:11px;font-weight:750}.pill.approved{background:#d8f8e9;color:#08744b}.pill.rejected{background:#ffe2e2;color:#a51d2d}
input,select,textarea{border:1px solid #cbdcf0;border-radius:10px;background:rgba(255,255,255,.9);color:#18385f}input:focus,select:focus,textarea:focus{border-color:#1684cf;box-shadow:0 0 0 3px rgba(22,132,207,.13)}.modalback{background:rgba(10,28,54,.4);backdrop-filter:blur(8px)}.modal{border:1px solid rgba(255,255,255,.85);border-radius:20px;background:linear-gradient(145deg,rgba(255,255,255,.98),rgba(241,248,255,.97));box-shadow:0 25px 80px rgba(7,34,72,.25)}.login{background:rgba(255,255,255,.82);border:1px solid rgba(255,255,255,.94);border-radius:22px;box-shadow:0 24px 70px rgba(20,67,117,.16);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
.dash-welcome{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:20px}.dash-kicker{font-size:12px;letter-spacing:3px;font-weight:700;color:#274d7b}.dash-welcome h1{font-size:clamp(28px,2.4vw,38px);margin:3px 0;color:#07133d;letter-spacing:-1px}.dash-welcome p{margin:0;color:#48658c;font-size:15px}.dash-date{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.95);border-radius:16px;padding:13px 18px;box-shadow:0 8px 20px rgba(30,70,120,.06);white-space:nowrap}.dash-middle{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(320px,1fr);gap:14px;margin:16px 0}.dash-panel{margin:0;min-width:0}.dash-panel-title{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;color:#0b2b60;margin:0 0 16px}.dash-chart{height:185px;display:flex;align-items:end;justify-content:space-around;gap:12px;padding:15px 8px 0;border-bottom:1px solid rgba(135,164,201,.45);background:repeating-linear-gradient(to bottom,transparent 0,transparent 44px,rgba(117,155,202,.15) 45px)}.chart-col{flex:1;max-width:72px;display:flex;flex-direction:column;justify-content:end;align-items:stretch;height:100%;text-align:center;color:#47658d;font-size:12px}.chart-bar{width:100%;margin-top:auto;border-radius:4px 4px 0 0;background:linear-gradient(to top,#0875dd 0 75%,#ff9d3d 75% 100%);box-shadow:0 3px 10px rgba(8,116,185,.12)}.chart-month{padding-top:7px}.chart-legend{display:flex;gap:15px;justify-content:flex-end;font-size:11px;color:#34557f;margin-bottom:8px}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:#0875dd}.dot.orange{background:#ff8b2b}.quick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.quick-action{display:flex;align-items:center;justify-content:center;gap:9px;min-height:78px;text-align:center;white-space:normal;background:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.96);border-radius:15px;color:#0a4c92;font-weight:700;padding:12px}.quick-action.orange{background:rgba(255,232,210,.65);color:#9a4d00}.quick-action:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(20,75,130,.1)}.quick-action .qicon{font-size:25px}.recent-title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.recent-title h2{font-size:20px;margin:0;color:#071f50}.recent-title .btn{padding:7px 10px}.recent-wrap{margin-top:14px}.recent-wrap .tablebox{box-shadow:none}.recent-wrap table{min-width:950px}.recent-wrap th{white-space:nowrap}.recent-wrap td{font-size:12px;padding:10px 11px}
@media(max-width:1100px){.dash-middle{grid-template-columns:1fr}.dash-chart{height:160px}}
@media(max-width:850px){#app{grid-template-columns:1fr}.side{padding:10px 12px;border-right:0;border-bottom:1px solid rgba(255,255,255,.7)}.logo{display:flex;align-items:center;gap:12px;text-align:left;padding:4px 6px 10px}.side-logo{width:145px;max-width:145px;margin:0;padding:0}.logo small{font-size:8px}.nav{display:flex;overflow:auto;padding-bottom:3px}.nav button{white-space:nowrap;min-height:42px;padding:9px 12px}.top{padding:12px 15px}.content{padding:14px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.head{flex-direction:column;align-items:flex-start}.dash-welcome{align-items:flex-start;flex-direction:column}.dash-date{white-space:normal}.grid{grid-template-columns:1fr}.span2{grid-column:auto}}
@media(max-width:480px){.stats{gap:8px}.stat{padding:13px;min-height:118px}.stat .stat-value{font-size:24px}.stat .stat-icon{width:38px;height:38px;font-size:19px;margin-right:9px}.quick-grid{grid-template-columns:1fr 1fr}.quick-action{font-size:12px;min-height:72px;padding:8px}.dash-chart{gap:5px}}


.bill-signatures{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 24px;margin-top:22px;page-break-inside:avoid;break-inside:avoid}.bill-signature{min-height:100px;font-size:12px;page-break-inside:avoid;break-inside:avoid;display:flex;flex-direction:column;align-items:flex-start}.bill-signature-area{height:52px;width:100%;display:flex;align-items:flex-end;justify-content:flex-start;margin:0 0 4px}.bill-signature-image{display:block;max-width:145px;width:auto;height:auto;max-height:48px;object-fit:contain;object-position:left bottom;margin:0}.signature-line{height:28px;width:100%;border-bottom:1px solid #222;margin-bottom:7px}.signature-meta{margin-top:4px;color:#333}@media print{.bill-signatures{grid-template-columns:repeat(3,minmax(0,1fr));gap:24px 18px}.bill-signature-area{height:52px}.bill-signature-image{max-width:145px;max-height:48px}.bill-signature{font-size:11px}}@media(max-width:650px){.bill-signatures{grid-template-columns:repeat(2,minmax(0,1fr))}}

async function adminApi(payload){
  const {data,error}=await sb.auth.getSession();if(error)throw error;
  const token=data?.session?.access_token;if(!token)throw new Error('Please sign in again.');
  const response=await fetch('/api/admin-users',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(payload)});
  const result=await response.json().catch(()=>({}));
  if(!response.ok)throw new Error(result.error||'Admin request failed.');
  return result;
}
