function parseEmployeeCSV(text){
 const rows=[];let row=[],cell='',quoted=false;
 for(let i=0;i<text.length;i++){const ch=text[i],next=text[i+1];if(quoted){if(ch==='"'&&next==='"'){cell+='"';i++}else if(ch==='"')quoted=false;else cell+=ch}else if(ch==='"')quoted=true;else if(ch===','){row.push(cell);cell=''}else if(ch==='\n'){row.push(cell);rows.push(row);row=[];cell=''}else if(ch!=='\r')cell+=ch}
 if(quoted)throw new Error('CSV contains an unfinished quoted field.');if(cell.length||row.length){row.push(cell);rows.push(row)}
 return rows.filter(r=>r.some(v=>String(v).trim()!==''));
}
async function handleBulkEmployeeFile(input){
 const file=input.files&&input.files[0];if(!file)return;
 try{
  if(!/\.csv$/i.test(file.name))throw new Error('Please upload a .csv file. Download and use the provided template.');
  const raw=await file.text(),parsed=parseEmployeeCSV(raw);if(parsed.length<2)throw new Error('The CSV has no employee rows.');
  const norm=v=>String(v||'').replace(/^\\uFEFF/,'').trim().toLowerCase().replace(/\\s+/g,' ');
  const headerRow=parsed[0].map(norm),aliases={
   code:['employee code'],name:['employee name'],work:['nature of work'],mobile:['mobile number'],joining:['joining date'],project:['initial project'],wage:['daily wage (inr)','daily wage'],ot:['ot rate per hour (inr)','ot rate per hour']
  };
  const ix={};for(const [k,names] of Object.entries(aliases))ix[k]=headerRow.findIndex(h=>names.includes(h));
  const missing=Object.entries(aliases).filter(([k])=>k!=='mobile'&&ix[k]<0).map(([,v])=>v[0]);
  if(missing.length)throw new Error('Missing required CSV columns: '+missing.join(', '));
  const seenCodes=new Set(),existing=new Set(employees.map(e=>String(e.employee_code||'').trim().toLowerCase())),valid=[],errors=[];
  for(let n=1;n<parsed.length;n++){
   const cells=parsed[n],get=k=>ix[k]<0?'':String(cells[ix[k]]??'').trim(),line=n+1;
   const rec={code:get('code'),name:get('name'),work:get('work'),mobile:get('mobile'),joining:get('joining'),project:get('project'),wage:get('wage'),ot:get('ot')};
   const issues=[];
   // Normalize common Excel date exports to ISO (YYYY-MM-DD) before validation.
   const normalizeJoiningDate=value=>{
    let v=String(value??'').replace(/^\\uFEFF/,'').replace(/[\\u200B-\\u200D\\uFEFF]/g,'').trim();
    if(!v)return '';
    let m=v.match(/^(\\d{4})[-/.](\\d{1,2})[-/.](\\d{1,2})(?:[ T].*)?$/);
    if(m){const y=+m[1],mo=+m[2],d=+m[3],dt=new Date(Date.UTC(y,mo-1,d));return dt.getUTCFullYear()===y&&dt.getUTCMonth()===mo-1&&dt.getUTCDate()===d?String(y).padStart(4,'0')+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0'):'';}
    m=v.match(/^(\\d{1,2})[-/.](\\d{1,2})[-/.](\\d{4})$/);
    if(m){const d=+m[1],mo=+m[2],y=+m[3],dt=new Date(Date.UTC(y,mo-1,d));return dt.getUTCFullYear()===y&&dt.getUTCMonth()===mo-1&&dt.getUTCDate()===d?String(y).padStart(4,'0')+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0'):'';}
    // Excel serial date (days since 1899-12-30).
    if(/^\\d{5}(?:\\.0+)?$/.test(v)){const dt=new Date(Date.UTC(1899,11,30)+Math.floor(Number(v))*86400000);return dt.toISOString().slice(0,10);}
    return '';
   };
   rec.joining=normalizeJoiningDate(rec.joining);
   for(const k of ['code','name','work','joining','project','wage','ot'])if(!rec[k])issues.push(aliases[k][0]+' is required');
   if(get('joining')&&!rec.joining)issues.push('Joining Date is not a valid date. Use YYYY-MM-DD (example: 2026-09-01), DD-MM-YYYY, or an Excel date cell.');
   const numericValue=v=>String(v??'').replace(/[,₹\\s]/g,'').trim();
   rec.wage=numericValue(rec.wage);rec.ot=numericValue(rec.ot);
   for(const k of ['wage','ot'])if(rec[k]!==''&&(!Number.isFinite(Number(rec[k]))||Number(rec[k])<0))issues.push(aliases[k][0]+' must be a non-negative number');
   const code=rec.code.toLowerCase();if(code&&seenCodes.has(code))issues.push('Duplicate Employee Code in this CSV');if(code&&existing.has(code))issues.push('Employee Code already exists');
   const project=projects.find(p=>String(p.id)===rec.project||norm(projectName(p.id))===norm(rec.project));
   if(rec.project&&!project)issues.push('Initial Project does not match a project in the portal');
   if(issues.length)errors.push('Row '+line+' ('+(rec.code||'no code')+'): '+issues.join('; '));
   else{seenCodes.add(code);valid.push({...rec,project_id:project.id,wage_per_day:Number(rec.wage),overtime_rate:Number(rec.ot)})}
  }
  if(errors.length)throw new Error('No employees were imported because the CSV has validation errors:\\n'+errors.slice(0,12).join('\\n')+(errors.length>12?'\\n…and '+(errors.length-12)+' more.':''));
  if(!valid.length)throw new Error('No employee records found to import.');
  if(!confirm('Ready to register '+valid.length+' employees?\\n\\nEach row will use the same registration process as the individual form, including initial project assignment and wage history. This cannot be bulk-undone.'))return;
  let done=0;for(const e of valid){
   await rpc('admin_create_regular_employee_with_wage',{p_employee_code:e.code,p_employee_name:e.name,p_nature_of_work:e.work,p_joining_date:e.joining,p_project_id:e.project_id,p_wage_per_day:e.wage_per_day,p_overtime_rate:e.overtime_rate,p_mobile_number:e.mobile||null});done++;
  }
  await load();render();msg('Successfully registered '+done+' employees from the CSV.');
 }catch(e){msg(e.message||String(e),'error')}
 finally{input.value=''}
}

 function grid(){
  const es=activeEmployeesForProject(project.value,date.value);
  const isSunday=new Date(date.value+'T12:00:00').getDay()===0;
  const projectCodes=codes.filter(c=>c.project_id===project.value&&c.is_active).sort((a,b)=>a.activity_code.localeCompare(b.activity_code,undefined,{numeric:true}));
  const datalistId='attendanceActivityCodes';
  const datalist='<datalist id="'+datalistId+'">'+projectCodes.map(c=>'<option value="'+esc(c.activity_code+' - '+c.activity_name)+'"></option>').join('')+'</datalist>';
  const rows=es.map(e=>{
   const prev=attendance.find(a=>a.employee_id===e.id&&a.attendance_date===date.value);
   const chosen=prev?.attendance_type||'';
   const option=(value,label)=>'<label class="attendance-choice '+(chosen===value?'is-selected':'')+'"><input type="radio" required name="attendance_'+e.id+'" data-e="'+e.id+'" data-k="type" value="'+value+'" '+(chosen===value?'checked':'')+'><span>'+label+'</span></label>';

  }).join('');
  $('attendanceGrid').innerHTML=datalist+'<table><thead><tr><th>Employee</th><th>Attendance</th><th>Activity Code</th><th>OT Hours</th><th>Sunday Extra ₹</th><th>Other ₹</th><th>Remarks</th></tr></thead><tbody>'+(rows||'<tr><td colspan="7" class="empty">No active employees assigned to this project on this date.</td></tr>')+'</tbody></table>';
  $('attendanceGrid').querySelectorAll('.attendance-choice input').forEach(input=>input.addEventListener('change',()=>{const group=input.closest('.attendance-options');group.querySelectorAll('.attendance-choice').forEach(label=>label.classList.toggle('is-selected',label.querySelector('input').checked));}));
 }
 project.onchange=grid;date.onchange=grid;grid();
 form.onsubmit=async ev=>{ev.preventDefault();const pid=project.value,dt=date.value,es=activeEmployeesForProject(pid,dt);try{for(const e of es){const val=k=>form.querySelector('[data-e="'+e.id+'"][data-k="'+k+'"]:checked')?.value??form.querySelector('[data-e="'+e.id+'"][data-k="'+k+'"]')?.value;const attendanceType=val('type');if(!attendanceType)throw new Error('Please mark attendance for '+e.employee_name);const typedActivity=(val('activity')||'').trim();const activity=typedActivity?codes.find(c=>c.project_id===pid&&c.is_active&&(typedActivity.toLowerCase()===c.activity_code.toLowerCase()||typedActivity.toLowerCase()=== (c.activity_code+' - '+c.activity_name).toLowerCase()||typedActivity.toLowerCase()===c.activity_name.toLowerCase())):null;if(typedActivity&&!activity)throw new Error('Select a valid activity code from the suggestions for '+e.employee_name);if(attendanceType!=='absent'&&!activity)throw new Error('Select an activity code for '+e.employee_name);await rpc('save_regular_employee_attendance',{p_employee_id:e.id,p_project_id:pid,p_attendance_date:dt,p_attendance_type:attendanceType,p_overtime_hours:Number(val('ot')||0),p_sunday_extra:new Date(dt+'T12:00:00').getDay()===0?Number(val('sun')||0):0,p_remarks:val('remarks')||null,p_activity_code_id:activity?.id||null,p_other_amount:Number(val('other')||0)})}await load();render();msg('Attendance saved for '+es.length+' employees.')}catch(err){msg(err.message,'error')}}

function renderAdvances(){
 $('view').innerHTML=header('Advance Management','Record direct advances or Site Engineer requests. Approved advances are deducted in the relevant weekly muster.')+
 '<div class="panel"><form id="advanceForm"><div class="formgrid"><div class="field"><label>Project *</label>'+projectSelect()+'</div><div class="field"><label>Employee *</label><select name="employee_id" required></select></div><div class="field"><label>Date *</label><input type="date" name="advance_date" value="'+dateToday()+'" required></div><div class="field"><label>Amount ₹ *</label><input type="number" name="amount" min=".01" step=".01" required></div><div class="field"><label>Entry method *</label><select name="request_method"><option value="direct">Direct advance entry</option><option value="site_engineer_request">Site Engineer request</option></select></div><div class="field"><label>Reason</label><input name="reason"></div></div><div class="actions"><button class="btn primary">Save Advance</button></div></form></div><div class="tablewrap"><table><thead><tr><th>Date</th><th>Employee</th><th>Project</th><th>Amount</th><th>Deducted</th><th>Balance</th><th>Method</th><th>Status</th><th>Action</th></tr></thead><tbody>'+advances.map(a=>{const e=employees.find(x=>x.id===a.employee_id);return '<tr><td>'+a.advance_date+'</td><td>'+esc(e?.employee_name||'')+'</td><td>'+esc(projectName(a.project_id))+'</td><td>₹'+Number(a.amount).toFixed(2)+'</td><td>₹'+Number(a.deducted_amount).toFixed(2)+'</td><td>₹'+(Number(a.amount)-Number(a.deducted_amount)).toFixed(2)+'</td><td>'+a.request_method.replaceAll('_',' ')+'</td><td><span class="pill">'+a.status+'</span></td><td>'+(a.status==='requested'?'<button class="btn" onclick="decideAdvance(\''+a.id+'\',\'approved\')">Approve</button> <button class="btn" onclick="decideAdvance(\''+a.id+'\',\'rejected\')">Reject</button>':'—')+'</td></tr>'}).join('')||'<tr><td colspan="9" class="empty">No advances recorded.</td></tr>'+'</tbody></table></div>';
 const form=$('advanceForm');function fill(){const pid=form.elements.project_id.value,dt=form.elements.advance_date.value;form.elements.employee_id.innerHTML=activeEmployeesForProject(pid,dt).map(e=>'<option value="'+e.id+'">'+esc(e.employee_code+' · '+e.employee_name)+'</option>').join('')}form.elements.project_id.onchange=fill;form.elements.advance_date.onchange=fill;fill();
 form.onsubmit=async ev=>{ev.preventDefault();const f=new FormData(form);try{await rpc('create_regular_employee_advance',{p_employee_id:f.get('employee_id'),p_project_id:f.get('project_id'),p_advance_date:f.get('advance_date'),p_amount:Number(f.get('amount')),p_request_method:f.get('request_method'),p_reason:f.get('reason')||null});await load();render();msg('Advance entry saved.')}catch(e){msg(e.message,'error')}}

async function decideAdvance(id,decision){const reason=prompt('Optional comment / reason:')||null;try{await rpc('decide_regular_employee_advance',{p_advance_id:id,p_decision:decision,p_reason:reason});await load();render();msg('Advance request '+decision+'.')}catch(e){msg(e.message,'error')}}
function renderMusters(){
 $('view').innerHTML=header('Weekly Muster','HR prepares payroll for an exact seven-day period after checking daily attendance, wage rates, overtime, Sunday extra, other amounts and advances.')+
 '<div class="panel"><form id="musterForm"><div class="formgrid"><div class="field"><label>Project *</label>'+projectSelect()+'</div><div class="field"><label>Period from *</label><input type="date" name="period_from" required></div><div class="field"><label>Period to *</label><input type="date" name="period_to" required></div></div><div class="notice">Select exactly seven consecutive days. Payroll preparation is restricted to HR and system administrators.</div><div class="actions"><button class="btn primary">Prepare Seven-Day Payroll</button></div></form></div><div id="musterList"></div>';
 $('musterForm').onsubmit=async ev=>{ev.preventDefault();const f=new FormData(ev.target);try{const from=new Date(f.get('period_from')+'T12:00:00'),to=new Date(f.get('period_to')+'T12:00:00');if(Math.round((to-from)/86400000)!==6)throw new Error('Select exactly seven consecutive days.');const id=await rpc('generate_regular_employee_muster',{p_project_id:f.get('project_id'),p_period_from:f.get('period_from'),p_period_to:f.get('period_to')});await load();renderMusterDetail(id);msg('Draft muster calculated. Review each employee and assign activity codes.')}catch(e){msg(e.message,'error')}}
 $('musterList').innerHTML=musters.map(m=>'<div class="panel"><b>'+esc(projectName(m.project_id))+'</b> · '+m.period_from+' to '+m.period_to+' <span class="pill">'+m.status+'</span><div class="muted">Gross ₹'+Number(m.total_gross).toFixed(2)+' · Advances ₹'+Number(m.total_advance_deduction).toFixed(2)+' · Net ₹'+Number(m.total_net).toFixed(2)+'</div><button class="btn" onclick="renderMusterDetail(\''+m.id+'\')">Open Muster</button></div>').join('')||'<p class="empty">No musters generated.</p>';

function renderMusterDetail(id){
 const m=musters.find(x=>x.id===id);if(!m)return;const lines=musterLines.filter(x=>x.muster_id===id);
 const days=Array.from({length:7},(_,i)=>{const d=new Date(m.period_from+'T12:00:00');d.setDate(d.getDate()+i);return d.toISOString().slice(0,10)});
 const dayHead=days.map(d=>'<th colspan="2">'+d.slice(5)+'</th>').join(''),subHead=days.map(()=>'<th>Prsnt</th><th>OT</th>').join('');
 const body=lines.map((l,i)=>{const daily=days.map(d=>{const a=attendance.find(x=>x.employee_id===l.employee_id&&x.project_id===m.project_id&&x.attendance_date===d);const p=a?.attendance_type==='full_day'?1:a?.attendance_type==='half_day'?.5:0;return '<td>'+p+'</td><td>'+Number(a?.overtime_hours||0)+'</td>'}).join('');const remarks=days.map(d=>attendance.find(x=>x.employee_id===l.employee_id&&x.project_id===m.project_id&&x.attendance_date===d)?.remarks).filter(Boolean).join('; ');const wage=l.wage_breakdown?.[0]||{};return '<tr><td>'+(i+1)+'</td><td>'+esc(l.employee_name_snapshot)+'</td><td>'+esc(employees.find(e=>e.id===l.employee_id)?.nature_of_work||'')+'</td><td>₹'+Number(wage.wage_per_day||0).toFixed(2)+'</td><td>₹'+Number(wage.overtime_rate||0).toFixed(2)+'</td>'+daily+'<td>'+Number(l.full_days)+Number(l.half_days)*.5+'</td><td>₹'+Number(l.basic_amount).toFixed(2)+'</td><td>'+Number(l.overtime_hours).toFixed(2)+'</td><td>₹'+Number(l.overtime_amount).toFixed(2)+'</td><td>₹'+Number(l.sunday_extra).toFixed(2)+'</td><td>₹'+Number(l.other_amount||0).toFixed(2)+'</td><td>₹'+Number(l.advance_deduction).toFixed(2)+'</td><td>₹'+Number(l.net_amount).toFixed(2)+'</td><td>'+esc(remarks)+'</td></tr>'}).join('');
 $('musterList').innerHTML='<div class="panel"><div class="heading"><div><h2>'+esc(projectName(m.project_id))+' · '+m.period_from+' to '+m.period_to+'</h2><span class="pill">'+esc(m.status)+'</span></div><div class="actions"><button class="btn" onclick="window.print()">Print / Sign</button><button class="btn" onclick="renderMusters()">Back</button></div></div><div class="notice">Seven-day payroll register based on the first sheet of GEOJIT 1.xlsx. Activity code is captured in daily attendance and is not reallocated here.</div><div class="payroll-head"><h2>Site: '+esc(projectName(m.project_id))+'</h2><h3>Month: '+new Date(m.period_from+'T12:00:00').toLocaleString('en-IN',{month:'long',year:'numeric'})+'</h3><p>Period: '+m.period_from+' to '+m.period_to+'</p></div><div class="tablewrap payroll-sheet"><table><thead><tr><th rowspan="2">Sl No</th><th rowspan="2">Labour Name</th><th rowspan="2">Nature of Work</th><th rowspan="2">Wages per Day</th><th rowspan="2">OT Rate</th>'+dayHead+'<th rowspan="2">Total Duty</th><th rowspan="2">Total Wage (Rs.)</th><th rowspan="2">OT (Hr)</th><th rowspan="2">OT (Rs.)</th><th rowspan="2">Extra</th><th rowspan="2">Other</th><th rowspan="2">Advanced Amount (Rs.)</th><th rowspan="2">Payable Amount (Rs.)</th><th rowspan="2">Remarks</th></tr><tr>'+subHead+'</tr></thead><tbody>'+body+'</tbody></table></div><div class="signatures"><div>Prepared / Verified by HR: __________________</div><div>Director Signature: __________________</div><div>Accounts Payment: __________________</div></div></div>';
}

async function submitPayrollReport(id){
 if(!confirm('Submit this HR-verified seven-day payroll report to the Director for signature and approval?'))return;
 try{await rpc('submit_regular_employee_muster',{p_muster_id:id});await load();renderPayrollReports();msg('Payroll report submitted to the Director.')}
 catch(e){msg(e.message,'error')}
}
async function decidePayrollReport(id,decision){
 const comments=prompt(decision==='rejected'?'Enter reason for returning this payroll report:':'Optional verification comments:');
 if(decision==='rejected'&&!comments)return;
 try{await rpc('decide_regular_employee_muster',{p_muster_id:id,p_decision:decision,p_comments:comments||null});await load();renderPayrollReports();msg('Payroll report '+(decision==='approved'?'verified at this stage.':'returned for correction.'))}
 catch(e){msg(e.message,'error')}
}
function renderPayments(){
 const approved=musters.filter(m=>m.status==='approved');
 $('view').innerHTML=header('Payment Register','Accounts records payment only after Director signature and approval.')+approved.map(m=>'<div class="panel"><b>'+esc(projectName(m.project_id))+'</b> · '+m.period_from+' to '+m.period_to+'<p>Net payable: ₹'+Number(m.total_net).toFixed(2)+'</p><button class="btn primary" onclick="recordMusterPayment(\''+m.id+'\')">Record payment</button></div>').join('')+'<h3>Paid Musters</h3><div class="tablewrap"><table><thead><tr><th>Payment date</th><th>Project</th><th>Amount</th><th>Method</th><th>Reference</th></tr></thead><tbody>'+musterPayments.map(p=>{const m=musters.find(x=>x.id===p.muster_id);return '<tr><td>'+p.payment_date+'</td><td>'+esc(projectName(m?.project_id||''))+'</td><td>₹'+Number(p.amount).toFixed(2)+'</td><td>'+esc(p.payment_method)+'</td><td>'+esc(p.reference_number||'')+'</td></tr>'}).join('')+'</tbody></table></div>';
}
function renderPayrollReports(){
 $('view').innerHTML=header('Payroll Reports','HR reviews the seven-day payroll, submits it to the Director for signature, then Accounts records disbursement.')+
 '<div class="toolbar"><select id="reportProject"><option value="">All projects</option>'+projectOptions()+'</select><select id="reportStatus"><option value="all">All statuses</option><option value="draft">Draft</option><option value="approved">Fully verified</option><option value="paid">Paid</option><option value="pending">Awaiting verification</option><option value="rejected">Returned for correction</option></select><button class="btn primary" id="exportPayroll">Export CSV</button></div><div id="reportSummary" class="stats"></div><h2>Payroll report verification</h2><div id="payrollReportQueue"></div><h2>Employee-wise payroll details</h2><div class="tablewrap"><table><thead><tr><th>Project</th><th>Period</th><th>Employee</th><th>Full days</th><th>Half days</th><th>OT hours</th><th>Other</th><th>Basic</th><th>OT</th><th>Sunday</th><th>Gross</th><th>Advance</th><th>Net</th><th>Report status</th></tr></thead><tbody id="reportRows"></tbody></table></div>';
 function filteredMusters(){const pid=$('reportProject').value,st=$('reportStatus').value;return musters.filter(m=>(!pid||m.project_id===pid)&&(st==='all'||(st==='pending'?m.status.startsWith('pending_'):st==='approved'?m.status==='approved':m.status===st)))}
 function rows(){const ids=new Set(filteredMusters().map(m=>m.id));return musters.filter(m=>ids.has(m.id)).flatMap(m=>musterLines.filter(l=>l.muster_id===m.id).map(l=>({m,l})))}
 function paint(){
  const ms=filteredMusters(),rs=rows();
  $('reportSummary').innerHTML='<div class="stat">Payroll reports<strong>'+ms.length+'</strong></div><div class="stat">Gross wages<strong>₹'+ms.reduce((n,m)=>n+Number(m.total_gross),0).toFixed(2)+'</strong></div><div class="stat">Net payable<strong>₹'+ms.reduce((n,m)=>n+Number(m.total_net),0).toFixed(2)+'</strong></div>';
  $('payrollReportQueue').innerHTML=ms.map(m=>{
   const pending=m.status==='pending_director',editable=m.status==='draft'||m.status==='rejected',stage=pending?'Awaiting Director signature':m.status==='approved'?'Director approved':m.status==='paid'?'Paid':m.status==='rejected'?'Returned to HR':'Draft';
   const actions=editable?'<button class="btn" onclick="renderMusterDetail(\''+m.id+'\')">Review payroll sheet</button> <button class="btn primary" onclick="submitPayrollReport(\''+m.id+'\')">Submit to Director</button>':pending?'<button class="btn" onclick="renderMusterDetail(\''+m.id+'\')">View payroll sheet</button> <button class="btn primary" onclick="decidePayrollReport(\''+m.id+'\',\'approved\')">Director sign / approve</button> <button class="btn orange" onclick="decidePayrollReport(\''+m.id+'\',\'rejected\')">Return to HR</button>':m.status==='approved'?'<button class="btn" onclick="renderMusterDetail(\''+m.id+'\')">View signed payroll</button> <span class="pill">Ready for Accounts</span>':'';
   return '<div class="panel"><div class="heading"><div><b>'+esc(projectName(m.project_id))+'</b><div class="muted">Payroll period: '+m.period_from+' to '+m.period_to+'</div></div><span class="pill">'+esc(stage)+'</span></div><div class="stats"><div class="stat">Gross<strong>₹'+Number(m.total_gross).toFixed(2)+'</strong></div><div class="stat">Advance deduction<strong>₹'+Number(m.total_advance_deduction).toFixed(2)+'</strong></div><div class="stat">Net payable<strong>₹'+Number(m.total_net).toFixed(2)+'</strong></div></div><div class="actions">'+actions+'</div></div>';
  }).join('')||'<p class="empty">No payroll reports match this filter.</p>';
  $('reportRows').innerHTML=rs.map(({m,l})=>'<tr><td>'+esc(projectName(m.project_id))+'</td><td>'+m.period_from+' – '+m.period_to+'</td><td>'+esc(l.employee_name_snapshot)+'</td><td>'+l.full_days+'</td><td>'+l.half_days+'</td><td>'+l.overtime_hours+'</td><td>₹'+Number(l.other_amount||0).toFixed(2)+'</td><td>₹'+Number(l.basic_amount).toFixed(2)+'</td><td>₹'+Number(l.overtime_amount).toFixed(2)+'</td><td>₹'+Number(l.sunday_extra).toFixed(2)+'</td><td>₹'+Number(l.gross_amount).toFixed(2)+'</td><td>₹'+Number(l.advance_deduction).toFixed(2)+'</td><td>₹'+Number(l.net_amount).toFixed(2)+'</td><td>'+esc(m.status)+'</td></tr>').join('')||'<tr><td colspan="14" class="empty">No payroll records match this filter.</td></tr>';
 }
 $('reportProject').onchange=paint;$('reportStatus').onchange=paint;paint();
 $('exportPayroll').onclick=()=>{const rs=rows();const data=[['Project','Period From','Period To','Employee Code','Employee','Full Days','Half Days','OT Hours','Other','Basic','OT Amount','Sunday Extra','Gross','Advance Deduction','Net','Report Status'],...rs.map(({m,l})=>[projectName(m.project_id),m.period_from,m.period_to,l.employee_code_snapshot,l.employee_name_snapshot,l.full_days,l.half_days,l.overtime_hours,l.other_amount,l.basic_amount,l.overtime_amount,l.sunday_extra,l.gross_amount,l.advance_deduction,l.net_amount,m.status])];const csv=data.map(row=>row.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\\r\\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='regular-payroll-report.csv';a.click();URL.revokeObjectURL(url)}
}
async function recordMusterPayment(id){const m=musters.find(x=>x.id===id);const payment_date=prompt('Payment date (YYYY-MM-DD)',dateToday());if(!payment_date)return;const payment_method=prompt('Payment method (Bank transfer / Cash / UPI):','Bank transfer');if(!payment_method)return;const reference_number=prompt('Payment reference / UTR (optional):')||null;try{await rpc('record_regular_employee_muster_payment',{p_muster_id:id,p_payment_date:payment_date,p_amount:Number(m.total_net),p_payment_method:payment_method,p_reference_number:reference_number,p_remarks:null});await load();renderPayments();msg('Payment recorded.')}catch(e){msg(e.message,'error')}}

async function boot(){const {data,error}=await db.auth.getSession();if(error||!data.session){$('login').classList.remove('hidden');$('app').classList.add('hidden');return}currentUser=data.session.user;$('who').textContent=currentUser.email;$('login').classList.add('hidden');$('app').classList.remove('hidden');try{await load();render()}catch(e){msg('Could not load module data: '+e.message,'error')}}
boot();
