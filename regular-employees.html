<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crescent | Regular Employee Management</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--navy:#102b55;--blue:#0874b9;--orange:#f39200;--bg:#edf2f8;--surface:#f8fafc;--muted:#64748b;--line:#dce5ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font:14px/1.5 Inter,"Segoe UI",Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}.shell{max-width:1500px;margin:24px auto;background:#f7f9fc;border-radius:22px;overflow:hidden;box-shadow:0 18px 50px #18345612}.top{background:white;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.brand{font-weight:850;letter-spacing:1px}.brand small{display:block;font-size:10px;letter-spacing:2px;color:var(--muted)}.layout{display:grid;grid-template-columns:230px 1fr;min-height:80vh}.side{background:#fff;border-right:1px solid var(--line);padding:18px 12px}.nav button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:12px;border-radius:10px;color:#49617f;margin:4px 0;font-weight:650}.nav button.active,.nav button:hover{background:#eaf3fb;color:var(--blue)}main{padding:26px;min-width:0}.heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.heading h1{margin:0;font-size:26px}.muted{color:var(--muted)}.btn{border:1px solid var(--line);background:white;color:var(--navy);padding:9px 13px;border-radius:9px;font-weight:700}.primary{background:var(--blue);color:white;border-color:var(--blue)}.orange{background:var(--orange);color:#fff;border-color:var(--orange)}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:15px 0}.stat,.panel{background:white;border:1px solid var(--line);border-radius:13px;padding:17px}.stat strong{display:block;font-size:25px;margin-top:5px}.panel{margin:14px 0}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0}.toolbar input{max-width:320px}.tablewrap{overflow:auto;background:white;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;padding:12px;border-bottom:1px solid #edf1f6}th{background:#f4f7fb;color:#60738d;text-transform:uppercase;font-size:10px;letter-spacing:.6px}tr:last-child td{border:0}.pill{display:inline-block;border-radius:20px;background:#eaf3fb;color:#175d91;padding:4px 8px;font-size:11px;font-weight:750}.empty{text-align:center;color:var(--muted);padding:25px}.modal{position:fixed;inset:0;background:#0b1e3980;display:none;align-items:center;justify-content:center;padding:16px;z-index:5}.modal.open{display:flex}.dialog{width:min(680px,100%);max-height:92vh;overflow:auto;background:white;border-radius:16px;padding:22px}.dialog h2{margin:0 0 12px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.field label{display:block;font-weight:700;font-size:12px;margin:12px 0 5px}.field input,.field select{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:8px;background:#fff}.span2{grid-column:span 2}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.notice{padding:12px;background:#eff6ff;color:#214d7d;border-radius:9px;margin:12px 0}.message{margin:12px 0;padding:11px;border-radius:9px;display:none}.message.show{display:block}.message.error{background:#fff0f0;color:#a52222}.message.success{background:#eaf8ef;color:#176b42}#login{max-width:420px;margin:8vh auto;background:white;padding:26px;border-radius:16px;border:1px solid var(--line)}#login input{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;margin:5px 0 12px}@media(max-width:800px){.shell{margin:0;border-radius:0}.layout{grid-template-columns:1fr}.side{padding:8px;border-right:0;border-bottom:1px solid var(--line)}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;width:auto}.stats{grid-template-columns:1fr 1fr}main{padding:15px}.heading{align-items:flex-start;flex-direction:column}.formgrid{grid-template-columns:1fr}.span2{grid-column:auto}}
</style></head><body>
<div id="login"><div class="brand">CRESCENT <small>CONTRACTORS PVT. LTD.</small></div><h2>Regular Employee Management</h2><p class="muted">Sign in using your existing Crescent portal account.</p><form id="loginForm"><label>Username</label><input id="username" type="text" autocomplete="username" required><label>Password</label><input id="password" type="password" required><button type="submit" class="btn primary" style="width:100%">Sign in</button></form><div id="loginMsg" class="message"></div></div>
<div id="app" class="shell hidden"><header class="top"><div class="brand">CRESCENT <small>CONTRACTORS PVT. LTD. · REGULAR EMPLOYEE MANAGEMENT</small></div><div><span id="who" class="muted"></span> <button class="btn" id="signout">Sign out</button></div></header><div class="layout"><aside class="side"><nav class="nav"><button class="active" data-page="employees">Employee Directory</button><button data-page="projects">Project Assignments</button><button data-page="wages">Wage History</button><button data-page="codes">Activity Codes</button><button data-page="hr">HR Access</button></nav></aside><main><div id="message" class="message"></div><section id="view"></section></main></div></div>
<div id="modal" class="modal"><div class="dialog"><div style="display:flex;justify-content:space-between;align-items:center"><h2 id="modalTitle">Add</h2><button class="btn" id="closeModal">✕</button></div><div id="modalBody"></div></div></div>
<script>
const SUPABASE_URL='https://iqltunrvlosxdxucibef.supabase.co';
const SUPABASE_PUBLIC_KEY='sb_publishable_F6gwvkXDVWv7baPVOcOMmQ_iuB1iNwT';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLIC_KEY);
let currentUser=null,projects=[],employees=[],assignments=[],wages=[],codes=[],hrUsers=[],page='employees';
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function msg(t,type='success',where='message'){const e=$(where);e.textContent=t;e.className='message show '+type;}
function modal(title,html){$('modalTitle').textContent=title;$('modalBody').innerHTML=html;$('modal').classList.add('open')}
function closeModal(){$('modal').classList.remove('open')}
async function rpc(name,args){const {data,error}=await db.rpc(name,args);if(error)throw error;return data}
async function load(){const [p,e,a,w,c,h]=await Promise.all([
 db.from('projects').select('*').order('created_at',{ascending:false}),
 db.from('regular_employees').select('*').order('employee_name'),
 db.from('regular_employee_project_assignments').select('*').order('effective_from',{ascending:false}),
 db.from('regular_employee_wage_history').select('*').order('effective_from',{ascending:false}),
 db.from('regular_activity_codes').select('*').order('activity_code'),
 db.from('regular_employee_hr_users').select('*').order('granted_at',{ascending:false})
]);for(const [r,n] of [[p,'projects'],[e,'employees'],[a,'assignments'],[w,'wages'],[c,'codes'],[h,'hr users']])if(r.error)throw new Error(n+': '+r.error.message);projects=p.data||[];employees=e.data||[];assignments=a.data||[];wages=w.data||[];codes=c.data||[];hrUsers=h.data||[];}
function projectName(id){const p=projects.find(x=>x.id===id);return p?(p.name||p.project_name||p.title||p.project_title||p.id):id}
function projectOptions(){return projects.filter(p=>p.is_active!==false).map(p=>`<option value="${p.id}">${esc(p.name||p.project_name||p.title||p.project_title||p.id)}</option>`).join('')}
function activeAssignment(id){return assignments.find(a=>a.employee_id===id&&a.is_active)}
function currentWage(id){return wages.find(w=>w.employee_id===id&&!w.effective_to)||wages.find(w=>w.employee_id===id)}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));if(page==='employees')renderEmployees();if(page==='projects')renderAssignments();if(page==='wages')renderWages();if(page==='codes')renderCodes();if(page==='hr')renderHR();}
function header(title,desc,button=''){return `<div class="heading"><div><h1>${title}</h1><div class="muted">${desc}</div></div>${button}</div>`}
function renderEmployees(){ $('view').innerHTML=header('Employee Directory','Register and maintain regular employees. Subcontractor labour records are separate.',`<button class="btn primary" onclick="addEmployee()">+ Register Employee</button>`)+`<div class="stats"><div class="stat">Total employees<strong>${employees.length}</strong></div><div class="stat">Active employees<strong>${employees.filter(e=>e.is_active).length}</strong></div><div class="stat">Inactive employees<strong>${employees.filter(e=>!e.is_active).length}</strong></div></div><div class="toolbar"><input id="empSearch" placeholder="Search employee code, name or work"><select id="empStatus"><option value="all">All employees</option><option value="active">Active</option><option value="inactive">Inactive</option></select></div><div class="tablewrap"><table><thead><tr><th>Employee Code</th><th>Employee</th><th>Work Category</th><th>Project</th><th>Daily Wage</th><th>Status</th><th>Actions</th></tr></thead><tbody id="empRows"></tbody></table></div>`;fillEmployeeRows();$('empSearch').oninput=fillEmployeeRows;$('empStatus').onchange=fillEmployeeRows;}
function fillEmployeeRows(){const q=$('empSearch').value.toLowerCase(),s=$('empStatus').value;const rows=employees.filter(e=>(s==='all'||(s==='active'?e.is_active:!e.is_active))&&[e.employee_code,e.employee_name,e.nature_of_work].join(' ').toLowerCase().includes(q));$('empRows').innerHTML=rows.length?rows.map(e=>{const a=activeAssignment(e.id),w=currentWage(e.id);return `<tr><td>${esc(e.employee_code)}</td><td><b>${esc(e.employee_name)}</b><div class="muted">${esc(e.mobile_number||'')}</div></td><td>${esc(e.nature_of_work)}</td><td>${esc(a?projectName(a.project_id):'Not assigned')}</td><td>${w?'₹'+Number(w.wage_per_day).toFixed(2):'—'}</td><td><span class="pill">${e.is_active?'Active':'Inactive'}</span></td><td><button class="btn" onclick="employeeActions('${e.id}')">Manage</button></td></tr>`}).join(''):`<tr><td colspan="7" class="empty">No employees found.</td></tr>`;}
function addEmployee(){if(!projects.length){msg('No project records were returned. Check the projects table and active-project setup.','error');return}modal('Register Employee',`<form id="employeeForm"><div class="formgrid"><div class="field"><label>Employee Code *</label><input name="employee_code" required></div><div class="field"><label>Employee Name *</label><input name="employee_name" required></div><div class="field"><label>Nature of Work *</label><input name="nature_of_work" placeholder="Mason, Helper, Foreman" required></div><div class="field"><label>Mobile Number</label><input name="mobile_number"></div><div class="field"><label>Joining Date *</label><input name="joining_date" type="date" required value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Initial Project *</label><select name="project_id" required>${projectOptions()}</select></div></div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Register Employee</button></div></form>`);$('employeeForm').onsubmit=async ev=>{ev.preventDefault();const f=new FormData(ev.target);try{await rpc('admin_create_regular_employee',{p_employee_code:f.get('employee_code'),p_employee_name:f.get('employee_name'),p_nature_of_work:f.get('nature_of_work'),p_joining_date:f.get('joining_date'),p_project_id:f.get('project_id'),p_mobile_number:f.get('mobile_number')||null});closeModal();await load();render();msg('Employee registered successfully.');}catch(e){msg(e.message,'error')}};}
function employeeActions(id){const e=employees.find(x=>x.id===id),a=activeAssignment(id);modal(e.employee_name,`<div class="panel"><b>${esc(e.employee_code)}</b><p>${esc(e.nature_of_work)} · ${e.is_active?'Active':'Inactive'}</p><p>Current project: ${esc(a?projectName(a.project_id):'Not assigned')}</p></div><div class="actions" style="justify-content:flex-start;flex-wrap:wrap"><button class="btn" onclick="assignProject('${id}')">Transfer Project</button><button class="btn" onclick="addWage('${id}')">Add Wage Rate</button><button class="btn ${e.is_active?'':'primary'}" onclick="toggleEmployee('${id}',${!e.is_active})">${e.is_active?'Deactivate':'Reactivate'}</button></div><h3>Wage history</h3><div class="tablewrap"><table><thead><tr><th>Effective From</th><th>Effective To</th><th>Daily Wage</th><th>OT Rate</th></tr></thead><tbody>${wages.filter(w=>w.employee_id===id).map(w=>`<tr><td>${w.effective_from}</td><td>${w.effective_to||'Current'}</td><td>₹${Number(w.wage_per_day).toFixed(2)}</td><td>₹${Number(w.overtime_rate).toFixed(2)}</td></tr>`).join('')||'<tr><td colspan="4">No wage history</td></tr>'}</tbody></table></div>`)}
function assignProject(id){modal('Transfer Employee Project',`<form id="assignForm"><div class="field"><label>New Project *</label><select name="project_id" required>${projectOptions()}</select></div><div class="field"><label>Effective From *</label><input name="effective_from" type="date" required value="${new Date().toISOString().slice(0,10)}"></div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save Transfer</button></div></form>`);$('assignForm').onsubmit=async ev=>{ev.preventDefault();const f=new FormData(ev.target);try{await rpc('admin_assign_regular_employee_project',{p_employee_id:id,p_project_id:f.get('project_id'),p_effective_from:f.get('effective_from')});closeModal();await load();render();msg('Project assignment updated.');}catch(e){msg(e.message,'error')}}}
function addWage(id){modal('Add Wage Rate',`<form id="wageForm"><div class="formgrid"><div class="field"><label>Daily Wage (₹) *</label><input name="wage_per_day" type="number" min="0" step="0.01" required></div><div class="field"><label>OT Rate per Hour (₹) *</label><input name="overtime_rate" type="number" min="0" step="0.01" required></div><div class="field"><label>Effective From *</label><input name="effective_from" type="date" required value="${new Date().toISOString().slice(0,10)}"></div><div class="field"><label>Remarks</label><input name="remarks"></div></div><div class="notice">Existing wage records are preserved. The new effective date must be later than the latest wage record.</div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save Wage</button></div></form>`);$('wageForm').onsubmit=async ev=>{ev.preventDefault();const f=new FormData(ev.target);try{await rpc('hr_save_regular_employee_wage',{p_employee_id:id,p_wage_per_day:Number(f.get('wage_per_day')),p_overtime_rate:Number(f.get('overtime_rate')),p_effective_from:f.get('effective_from'),p_remarks:f.get('remarks')||null});closeModal();await load();render();msg('Wage history updated.');}catch(e){msg(e.message,'error')}}}
async function toggleEmployee(id,active){const date=active?null:prompt('Leaving date (YYYY-MM-DD)',new Date().toISOString().slice(0,10));if(!active&&!date)return;try{await rpc('admin_set_regular_employee_active',{p_employee_id:id,p_is_active:active,p_leaving_date:date});closeModal();await load();render();msg('Employee status updated.');}catch(e){msg(e.message,'error')}}
function renderAssignments(){$('view').innerHTML=header('Project Assignments','View the current and historical project allocation of regular employees.')+`<div class="tablewrap"><table><thead><tr><th>Employee</th><th>Project</th><th>From</th><th>To</th><th>Status</th><th></th></tr></thead><tbody>${assignments.map(a=>{const e=employees.find(x=>x.id===a.employee_id);return `<tr><td>${esc(e?.employee_name||a.employee_id)}</td><td>${esc(projectName(a.project_id))}</td><td>${a.effective_from}</td><td>${a.effective_to||'—'}</td><td>${a.is_active?'Active':'Closed'}</td><td>${a.is_active?`<button class="btn" onclick="assignProject('${a.employee_id}')">Transfer</button>`:''}</td></tr>`}).join('')||'<tr><td colspan="6" class="empty">No assignments.</td></tr>'}</tbody></table></div>`}
function renderWages(){$('view').innerHTML=header('Wage History','Wage changes are effective-dated and preserve historical rates.')+`<div class="tablewrap"><table><thead><tr><th>Employee</th><th>Effective From</th><th>Effective To</th><th>Daily Wage</th><th>OT / Hour</th><th>Remarks</th></tr></thead><tbody>${wages.map(w=>{const e=employees.find(x=>x.id===w.employee_id);return `<tr><td>${esc(e?.employee_name||w.employee_id)}</td><td>${w.effective_from}</td><td>${w.effective_to||'Current'}</td><td>₹${Number(w.wage_per_day).toFixed(2)}</td><td>₹${Number(w.overtime_rate).toFixed(2)}</td><td>${esc(w.remarks||'')}</td></tr>`}).join('')||'<tr><td colspan="6" class="empty">No wage history.</td></tr>'}</tbody></table></div>`}
function renderCodes(){$('view').innerHTML=header('Project Activity Codes','Maintain activity codes available for regular employee cost allocation.',`<button class="btn primary" onclick="addCode()">+ Add Activity Code</button>`)+`<div class="tablewrap"><table><thead><tr><th>Project</th><th>Activity Code</th><th>Description</th><th>Status</th></tr></thead><tbody>${codes.map(c=>`<tr><td>${esc(projectName(c.project_id))}</td><td>${esc(c.activity_code)}</td><td>${esc(c.activity_name)}</td><td>${c.is_active?'Active':'Inactive'}</td></tr>`).join('')||'<tr><td colspan="4" class="empty">No activity codes added.</td></tr>'}</tbody></table></div>`}
function addCode(){modal('Add Activity Code',`<form id="codeForm"><div class="field"><label>Project *</label><select name="project_id" required>${projectOptions()}</select></div><div class="field"><label>Activity Code *</label><input name="activity_code" required></div><div class="field"><label>Activity Description *</label><input name="activity_name" required></div><div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save Code</button></div></form>`);$('codeForm').onsubmit=async ev=>{ev.preventDefault();const f=new FormData(ev.target);const {error}=await db.from('regular_activity_codes').insert({project_id:f.get('project_id'),activity_code:f.get('activity_code'),activity_name:f.get('activity_name'),created_by:currentUser.id});if(error){msg(error.message,'error');return}closeModal();await load();render();msg('Activity code added.')}}
function renderHR(){$('view').innerHTML=header('HR Access','Grant the separate regular-employee HR permission to an existing portal user.')+`<div class="notice">Enter the user UUID from the existing portal user administration. Only system administrators can grant or revoke this permission.</div><form id="hrForm" class="panel"><div class="field"><label>Existing user UUID *</label><input name="user_id" required placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"></div><div class="actions"><button class="btn primary">Grant HR Access</button></div></form><div class="tablewrap"><table><thead><tr><th>User ID</th><th>Granted At</th><th>Status</th><th>Action</th></tr></thead><tbody>${hrUsers.map(h=>`<tr><td>${h.user_id}</td><td>${h.granted_at||''}</td><td>${h.is_active?'Active':'Revoked'}</td><td><button class="btn" onclick="revokeHR('${h.user_id}')">${h.is_active?'Revoke':'Reactivate'}</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">No HR users configured.</td></tr>'}</tbody></table></div>`;$('hrForm').onsubmit=async ev=>{ev.preventDefault();const id=new FormData(ev.target).get('user_id');try{await rpc('admin_grant_regular_employee_hr',{p_user_id:id,p_is_active:true});await load();render();msg('HR access granted.');}catch(e){msg(e.message,'error')}}}
async function revokeHR(id){try{await rpc('admin_grant_regular_employee_hr',{p_user_id:id,p_is_active:false});await load();render();msg('HR access revoked.')}catch(e){msg(e.message,'error')}}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});$('closeModal').onclick=closeModal;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};$('signout').onclick=async()=>{await db.auth.signOut();location.reload()};$('loginForm').onsubmit=async e=>{e.preventDefault();const button=$('loginForm').querySelector('button[type=submit]');button.disabled=true;msg('Signing in…','success','loginMsg');try{const response=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value.trim().toLowerCase(),password:$('password').value})});const result=await response.json().catch(()=>({}));if(!response.ok||!result.session)throw new Error(result.error||'Invalid username or password.');const {data,error}=await db.auth.setSession({access_token:result.session.access_token,refresh_token:result.session.refresh_token});if(error)throw error;currentUser=data.user;await boot()}catch(error){msg('Sign-in failed: '+error.message,'error','loginMsg')}finally{button.disabled=false}};
async function boot(){const {data,error}=await db.auth.getSession();if(error||!data.session){$('login').classList.remove('hidden');$('app').classList.add('hidden');return}currentUser=data.session.user;$('who').textContent=currentUser.email;$('login').classList.add('hidden');$('app').classList.remove('hidden');try{await load();render()}catch(e){msg('Could not load module data: '+e.message,'error')}}
boot();
</script></body></html>
