function parseEmployeeCSV(text){
 const rows=[];let row=[],cell='',quoted=false;
 for(let i=0;i<text.length;i++){const ch=text[i],next=text[i+1];if(quoted){if(ch==='"'&&next==='"'){cell+='"';i++}else if(ch==='"')quoted=false;else cell+=ch}else if(ch==='"')quoted=true;else if(ch===','){row.push(cell);cell=''}else if(ch==='\n'){row.push(cell);rows.push(row);row=[];cell=''}else if(ch!=='\r')cell+=ch}
 if(quoted)throw new Error('CSV contains an unfinished quoted field.');if(cell.length||row.length){row.push(cell);rows.push(row)}
 return rows.filter(r=>r.some(v=>String(v).trim()!==''));
}

   const issues=[];

   };

   if(get('joining')&&!rec.joining)issues.push('Joining Date is not a valid date. Use YYYY-MM-DD (example: 2026-09-01), DD-MM-YYYY, or an Excel date cell.');

async function loadActivityCost(){

   const basic=days*Number(wage?.wage_per_day||0),ot=Number(a.overtime_hours||0)*Number(wage?.overtime_rate||0),sunday=Number(a.sunday_extra||0),other=Number(a.other_amount||0),total=basic+ot+sunday+other;

   const g=groups.get(key);g.days+=days;g.employees.add(a.employee_id);g.basic+=basic;g.ot+=ot;g.sunday+=sunday;g.other+=other;g.total+=total;g.entries++;
  }
  const list=[...groups.values()].sort((a,b)=>a.code.localeCompare(b.code,undefined,{numeric:true})),totals=list.reduce((s,g)=>({basic:s.basic+g.basic,ot:s.ot+g.ot,sunday:s.sunday+g.sunday,other:s.other+g.other,total:s.total+g.total}),{basic:0,ot:0,sunday:0,other:0,total:0});
  const money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
  summary.innerHTML='<div class="stats"><div class="stat">Total activity cost<strong>'+money(totals.total)+'</strong></div><div class="stat">Activity codes<strong>'+list.length+'</strong></div><div class="stat">Attendance entries<strong>'+rows.length+'</strong></div></div><p class="muted">'+new Date(start+'T12:00:00').toLocaleString('en-IN',{month:'long',year:'numeric'})+(projectId?' · '+esc(projectName(projectId)):' · All projects')+'</p>';
  table.innerHTML='<div class="tablewrap"><table><thead><tr><th>Activity Code</th><th>Activity</th><th>Employees</th><th>Duty Days</th><th>Basic Wages</th><th>OT Cost</th><th>Sunday Extra</th><th>Other</th><th>Total Cost</th></tr></thead><tbody>'+
   (list.map(g=>'<tr><td>'+esc(g.code)+'</td><td>'+esc(g.name)+'</td><td>'+g.employees.size+'</td><td>'+g.days.toFixed(2)+'</td><td>'+money(g.basic)+'</td><td>'+money(g.ot)+'</td><td>'+money(g.sunday)+'</td><td>'+money(g.other)+'</td><td><b>'+money(g.total)+'</b></td></tr>').join('')||'<tr><td colspan="9" class="empty">No attendance entries found for this month and project.</td></tr>')+
   (list.length?'<tr style="font-weight:800;background:#f4f7fb"><td colspan="4">TOTAL</td><td>'+money(totals.basic)+'</td><td>'+money(totals.ot)+'</td><td>'+money(totals.sunday)+'</td><td>'+money(totals.other)+'</td><td>'+money(totals.total)+'</td></tr>':'')+'</tbody></table></div><p class="muted">Cost basis: full day = 1 day, half day = 0.5 day, basic wages use the wage rate effective on each attendance date; OT, Sunday Extra and Other are included against that day’s activity code. Rows without a code are shown as Unassigned.</p>';

 }catch(e){$('bankRows').innerHTML='<tr><td colspan="8" class="empty">'+esc(e.message)+'</td></tr>'}
}

 const e=employees.find(x=>x.id===employeeId);if(!e)return;
 const {data,error}=await db.from('regular_employee_bank_account_links').select('regular_employee_bank_accounts(account_number,account_holder_name,bank_name,ifsc_code,account_type)').eq('employee_id',employeeId).is('effective_to',null).eq('is_primary',true).maybeSingle();
 if(error){msg(error.message,'error');return}
 const b=data?.regular_employee_bank_accounts||{};
 modal('Update Bank Details — '+esc(e.employee_name),
 '<div class="formgrid"><label>Account Number<input id="editBankAccount" value="'+esc(b.account_number||'')+'" required></label><label>Account Holder Name<input id="editBankHolder" value="'+esc(b.account_holder_name||'')+'" required></label><label>Bank Name<input id="editBankName" value="'+esc(b.bank_name||'')+'"></label><label>IFSC Code<input id="editBankIfsc" value="'+esc(b.ifsc_code||'')+'" required maxlength="11"></label><label>Account Type<select id="editBankType"><option value="personal" '+((b.account_type||'personal')==='personal'?'selected':'')+'>Personal</option><option value="salary" '+(b.account_type==='salary'?'selected':'')+'>Salary</option><option value="current" '+(b.account_type==='current'?'selected':'')+'>Current</option></select></label><label>Reason for Change<input id="editBankReason" value="Employee requested bank detail update" required></label></div><div class="actions" style="justify-content:flex-end;margin-top:18px"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="saveEmployeeBankDetails(\''+employeeId+'\')">Save Bank Details</button></div>');
}
async function saveEmployeeBankDetails(employeeId){
 const account=$('editBankAccount').value.trim(),holder=$('editBankHolder').value.trim(),bank=$('editBankName').value.trim(),ifsc=$('editBankIfsc').value.trim().toUpperCase(),type=$('editBankType').value,reason=$('editBankReason').value.trim();
 if(!account||!holder||!ifsc||!reason){msg('Account number, account holder, IFSC and reason are required.','error');return}
 if(!/^[A-Z]{4}0[A-Z0-9]{6}$/.test(ifsc)){msg('Please enter a valid 11-character IFSC code.','error');return}
 try{await rpc('save_regular_employee_bank_details',{p_employee_id:employeeId,p_account_number:account,p_account_holder_name:holder,p_bank_name:bank,p_ifsc_code:ifsc,p_account_type:type,p_change_reason:reason});closeModal();await renderBankDetails();msg('Bank details updated successfully.');}
 catch(e){msg(e.message||String(e),'error')}
}

async function handleBankBulkFile(input){
 const preview=$('bankUploadPreview');preview.innerHTML='';
 try{
  const file=input.files?.[0];if(!file)return;
  const wb=XLSX.read(await file.arrayBuffer(),{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''});
  if(!rows.length)throw new Error('The uploaded sheet is empty.');
  const required=['Employee Code','Account Number','Account Holder Name','Bank Name','IFSC Code'];
  const missing=required.filter(k=>!(k in rows[0]));if(missing.length)throw new Error('Missing columns: '+missing.join(', '));
  const seen=new Set(),prepared=[];
  for(let i=0;i<rows.length;i++){
   const r=rows[i],code=String(r['Employee Code']).trim(),key=code.toLowerCase();
   if(!code||seen.has(key))throw new Error('Row '+(i+2)+': blank or duplicate employee code.');
   seen.add(key);
   const e=employees.find(x=>String(x.employee_code).trim().toLowerCase()===key);
   if(!e)throw new Error('Row '+(i+2)+': employee code '+code+' was not found.');
   const account=String(r['Account Number']).trim(),holder=String(r['Account Holder Name']).trim(),ifsc=String(r['IFSC Code']).trim().toUpperCase();
   if(!account||!holder||!ifsc)throw new Error('Row '+(i+2)+': account number, account holder and IFSC are mandatory.');
   if(!/^[A-Z]{4}0[A-Z0-9]{6}$/.test(ifsc))throw new Error('Row '+(i+2)+': invalid IFSC format.');
   prepared.push({employee:e,account,holder,bank:String(r['Bank Name']||''),ifsc,type:String(r['Account Type']||'personal'),reason:String(r['Change Reason']||'Bulk bank detail update')});
  }
  window.pendingBankUpdates=prepared;
  preview.innerHTML='<p><b>'+prepared.length+' employee bank records ready.</b> Existing active bank links will be closed and replaced from today.</p><button class="btn primary" onclick="confirmBankBulkUpdate()">Confirm & Update Bank Details</button>';
 }catch(e){preview.innerHTML='<p class="message error show">'+esc(e.message||String(e))+'</p>';}
}
async function confirmBankBulkUpdate(){
 const rows=window.pendingBankUpdates||[];if(!rows.length){msg('Upload and validate a bank details sheet first.','error');return;}
 if(!confirm('Update bank details for '+rows.length+' employees?'))return;
 try{
  for(const r of rows)await rpc('save_regular_employee_bank_details',{p_employee_id:r.employee.id,p_account_number:r.account,p_account_holder_name:r.holder,p_bank_name:r.bank,p_ifsc_code:r.ifsc,p_account_type:r.type,p_change_reason:r.reason});
  window.pendingBankUpdates=[];$('bankUploadPreview').innerHTML='<p class="message success show">Updated '+rows.length+' employee bank records.</p>';await load();renderBankDetails();msg('Bulk bank details updated successfully.');
 }catch(e){msg('Bulk update stopped: '+(e.message||String(e)),'error');}
}
async function renderPayrollReports(){
 $('view').innerHTML=header('Payroll Reports','Manage seven-day payroll according to your assigned role.')+
 '<div class="toolbar"><select id="reportProject"><option value="">All projects</option>'+projectOptions()+'</select><select id="reportStatus"><option value="all">All statuses</option><option value="draft">Draft / Site verification</option><option value="pending_pm">Pending Project Manager</option><option value="approved_by_pm">PM approved / HR processing</option><option value="pending_director">Pending Director</option><option value="approved">Director completed</option><option value="rejected">Returned</option></select></div><div id="payrollReportQueue"></div><div id="payrollEmployeeDetails"><h2>Employee-wise payroll details</h2><div class="tablewrap"><table><thead><tr><th>Project</th><th>Period</th><th>Employee</th><th>Site verification</th><th>HR action</th><th>Director</th><th>Accounts</th><th>Net payable</th></tr></thead><tbody id="reportRows"></tbody></table></div></div>';
 const [rr,hr,pr]=await Promise.all([
  db.from('project_assignments').select('project_id,role,is_active').eq('user_id',currentUser.id).eq('is_active',true),
  db.from('regular_employee_hr_users').select('user_id').eq('user_id',currentUser.id).eq('is_active',true),
  db.from('user_profiles').select('is_admin').eq('user_id',currentUser.id).maybeSingle()
 ]);
 if(rr.error||hr.error||pr.error){msg((rr.error||hr.error||pr.error).message,'error');return;}
 const roles=rr.data||[],pmProjects=new Set(roles.filter(x=>String(x.role).toLowerCase()==='project_manager').map(x=>x.project_id)),siteProjects=new Set(roles.filter(x=>String(x.role).toLowerCase()==='site_engineer').map(x=>x.project_id)),directorProjects=new Set(roles.filter(x=>String(x.role).toLowerCase()==='director').map(x=>x.project_id));
 const isPM=pmProjects.size>0,isSite=siteProjects.size>0,isDirector=directorProjects.size>0,isHR=(hr.data||[]).length>0,isAdmin=!!pr.data?.is_admin;
 const scoped=musters.filter(m=>isAdmin||isHR||pmProjects.has(m.project_id)||siteProjects.has(m.project_id)||directorProjects.has(m.project_id));
 if(isPM&&!isAdmin&&!isHR&&!isDirector){$('payrollEmployeeDetails').style.display='none';$('reportStatus').value='pending_pm';$('reportStatus').disabled=true;}
 if(isSite&&!isPM&&!isHR&&!isAdmin&&!isDirector){$('payrollEmployeeDetails').style.display='none';$('reportStatus').value='draft';$('reportStatus').disabled=true;}
 if(isDirector&&!isHR&&!isAdmin){$('payrollEmployeeDetails').style.display='none';$('reportStatus').value='pending_director';$('reportStatus').disabled=true;}
 function filtered(){const pid=$('reportProject').value,st=$('reportStatus').value;return scoped.filter(m=>(!pid||m.project_id===pid)&&(!isPM||isAdmin||isHR||isDirector||pmProjects.has(m.project_id))&&(!isSite||isPM||isHR||isAdmin||isDirector||siteProjects.has(m.project_id))&&(!isDirector||isHR||isAdmin||directorProjects.has(m.project_id))&&(st==='all'||(st==='draft'?['draft','pending_site_verification','rejected'].includes(m.status):m.status===st)))}
 function paint(){
  const ms=filtered();
  $('payrollReportQueue').innerHTML=ms.map(m=>{
   const lines=musterLines.filter(l=>l.muster_id===m.id),verified=lines.filter(l=>l.site_verification_status==='verified').length,processed=lines.filter(l=>l.hr_payment_status==='processed').length,held=lines.filter(l=>l.hr_payment_status==='held').length,allVerified=lines.length>0&&verified===lines.length;
   let actions='';
   if(isDirector&&!isHR&&!isAdmin){
    const pending=lines.filter(l=>l.director_line_status==='pending').length;
    actions=m.status==='pending_director'?'<button class="btn" onclick="renderMusterDetail(\''+m.id+'\')">View Payroll</button> <button class="btn primary" onclick="decideDirectorPayroll(\''+m.id+'\',\'approved\')">Approve Entire Payroll</button> <button class="btn orange" onclick="decideDirectorPayroll(\''+m.id+'\',\'rejected\')">Reject Entire Payroll</button>':'<button class="btn" onclick="renderMusterDetail(\''+m.id+'\')">View Payroll</button> <span class="pill">'+(m.status==='approved'?'Approved ✓':esc(m.status))+'</span>';
    return '<div class="panel"><div class="heading"><div><b>'+esc(projectName(m.project_id))+'</b><div class="muted">'+m.period_from+' to '+m.period_to+' · '+lines.length+' employees</div></div><span class="pill">'+esc(m.status)+'</span></div><div class="muted">Awaiting Director decision: '+pending+' lines · Total payable: ₹'+lines.reduce((s,l)=>s+Number(l.net_amount||0),0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2})+'</div><div class="actions">'+actions+'</div></div>';
   }
   if(isPM&&!isAdmin){
    const approved=['approved_by_pm','approved','pending_director'].includes(m.status);
    actions=m.status==='pending_pm'?'<button class="btn" onclick="renderMusterDetail(\''+m.id+'\')">View</button> <button class="btn primary" onclick="decidePayrollReport(\''+m.id+'\',\'approved\')">Approve</button>':'<button class="btn" onclick="renderMusterDetail(\''+m.id+'\')">View</button> <span class="pill" style="background:#e5f5e8;color:#218447">Approved ✓</span>';
    return '<div class="panel" style="background:'+(approved?'#eff9f0':'')+';border-color:'+(approved?'#b8dfbf':'')+'"><div class="heading"><div><b>'+esc(projectName(m.project_id))+'</b><div class="muted">'+m.period_from+' to '+m.period_to+' · '+lines.length+' employees</div></div><span class="pill">'+(approved?'Approved':esc(m.status))+'</span></div><div class="muted">Site verified: '+verified+'/'+lines.length+'</div><div class="actions">'+actions+'</div></div>';
   }
   if(isSite&&!isHR&&!isAdmin&&!isPM){
    if(m.status==='pending_pm'||['approved_by_pm','approved','pending_director'].includes(m.status))actions='<span class="pill" style="background:#e8f5e9;color:#218447">Submitted to PM ✓</span>';
    else if(['draft','pending_site_verification','rejected'].includes(m.status))actions='<button class="btn primary" onclick="renderSiteVerificationSheet(\''+m.id+'\')">Verify Attendance & Payroll</button>'+(allVerified?' <button class="btn primary" onclick="submitPayrollReport(\''+m.id+'\')">Submit Verified Sheet to PM</button>':' <span class="pill">Awaiting verification ('+verified+'/'+lines.length+')</span>');
    else actions='<span class="pill">Waiting for next workflow stage</span>';
   }else if(isHR&&!isAdmin){
    actions='<button class="btn" onclick="renderMusterDetail(\''+m.id+'\')">Open / Print Payroll Sheet</button>';
    if(['draft','pending_site_verification','rejected'].includes(m.status))actions+=' <button class="btn" onclick="renderMusterDetail(\''+m.id+'\')">Edit Payroll</button>';
    if(['draft','pending_site_verification','rejected'].includes(m.status))actions+=allVerified?' <span class="pill">Site verification complete</span>':' <span class="pill">Awaiting Site Verification ('+verified+'/'+lines.length+')</span>';
    if(['approved_by_pm','approved'].includes(m.status))actions+=' <button class="btn primary" onclick="renderHRProcessingSheet(\''+m.id+'\')">Process Payroll</button>';
    if(['pending_director','paid','partially_paid'].includes(m.status)&&held>0)actions+=' <button class="btn primary" onclick="renderHRProcessingSheet(\''+m.id+'\')">Process Held Payments ('+held+')</button>';
    
    if(['approved_by_pm','approved','pending_director','paid','partially_paid'].includes(m.status)&&processed>0&&lines.some(l=>l.hr_payment_status==='processed'&&!['pending','approved'].includes(l.director_line_status||'not_submitted')))actions+=' <button class="btn" onclick="submitPayrollToDirector(\''+m.id+'\')">Submit Processed Lines to Director</button>';
    if(m.status==='pending_pm')actions+=' <span class="pill">Pending PM approval</span>';
   }else{
    actions='<button class="btn" onclick="renderMusterDetail(\''+m.id+'\')">Open / Print Payroll Sheet</button>';
   }
   return '<div class="panel"><div class="heading"><div><b>'+esc(projectName(m.project_id))+'</b><div class="muted">'+m.period_from+' to '+m.period_to+' · '+lines.length+' employees</div></div><span class="pill">'+esc(m.status)+'</span></div><div class="muted">Site verified: '+verified+'/'+lines.length+' · HR processed: '+processed+' · Held: '+held+'</div><div class="actions">'+actions+'</div></div>';
  }).join('')||'<p class="empty">No payroll reports match this filter.</p>';
  if(isPM||isSite&&!isHR&&!isAdmin||isDirector&&!isHR&&!isAdmin){return;}
  $('reportRows').innerHTML=ms.flatMap(m=>musterLines.filter(l=>l.muster_id===m.id).map(l=>{
   let action='—';
   if(isHR&&!isAdmin&&['approved_by_pm','approved'].includes(m.status)&&l.hr_payment_status!=='processed'&&l.director_line_status!=='approved')action='<button class="btn primary" onclick="processPayrollLine(\''+l.id+'\',\'process\')">Process</button> <button class="btn orange" onclick="processPayrollLine(\''+l.id+'\',\'hold\')">Hold</button>';
   else if(isDirector&&!isHR&&!isAdmin&&m.status==='pending_director'&&l.director_line_status==='pending')action='Awaiting whole-payroll decision';
   else if(l.hr_payment_status==='held')action='<span class="pill">Held — HR can process later</span>';
   return '<tr><td>'+esc(projectName(m.project_id))+'</td><td>'+m.period_from+' – '+m.period_to+'</td><td>'+esc(l.employee_name_snapshot)+'</td><td>'+esc(l.site_verification_status||'pending')+'</td><td>'+esc(l.hr_payment_status||'pending')+' '+(isHR?action:'')+'</td><td>'+esc(l.director_line_status||'not_submitted')+'</td><td>'+esc(l.accounts_payment_status||'pending')+'</td><td>₹'+Number(l.net_amount).toFixed(2)+'</td></tr>';
  })).join('')||'<tr><td colspan="8" class="empty">No employee payroll lines.</td></tr>';
 }
 $('reportProject').onchange=paint;$('reportStatus').onchange=paint;paint();
}
async function recordMusterPayment(id){const m=musters.find(x=>x.id===id);const payment_date=prompt('Payment date (YYYY-MM-DD)',dateToday());if(!payment_date)return;const payment_method=prompt('Payment method (Bank transfer / Cash / UPI):','Bank transfer');if(!payment_method)return;const reference_number=prompt('Payment reference / UTR (optional):')||null;try{await rpc('record_regular_employee_muster_payment',{p_muster_id:id,p_payment_date:payment_date,p_amount:Number(m.total_net),p_payment_method:payment_method,p_reference_number:reference_number,p_remarks:null});await load();renderPayments();msg('Payment recorded.')}catch(e){msg(e.message,'error')}}

boot();
